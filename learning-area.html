<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Area | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-refresh.css?v=2026.10.9"><script src="site-shell.js?v=2026.10.9.2" defer></script></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="syllabus.html">Science</a><a href="learning-area.html?subject=Mathematics">Mathematics</a><a href="learning-area.html?subject=English">English</a><a href="learning-area.html?subject=HASS">HASS</a><a href="learning-area.html?subject=Health%20and%20Physical%20Education">Health & PE</a><a href="library.html">Resources</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow" id="eyebrow">WESTERN AUSTRALIA</span><h1 id="subjectTitle">Learning Area</h1><p id="subjectIntro"></p></div></section><main class="section content"><div class="notice" id="curriculumNotice"></div><div class="year-tabs syllabus-tabs" id="courseTabs"></div><div id="areaContent"></div></main><footer><strong>Learning Vault WA © 2026</strong><span>Free learning resources for Western Australian students</span></footer><script src="resources.js?v=20260927-allsubjects"></script><script src="senior-courses.js?v=20260927-2"></script><script src="senior-resources.js?v=20260927-allsubjects"></script><script>
const params=new URLSearchParams(location.search),subject=params.get('subject')||'Mathematics';let selected={kind:'year',value:'Year 7'};const DATA={Mathematics:{intro:'Years 7–12 Mathematics resources organised for Western Australian curriculum and senior secondary courses.',notice:'Choose a Year 7–10 tab or a separate senior ATAR/General course tab.',strands:['Number and algebra','Measurement and geometry','Probability and statistics']},English:{intro:'Years 7–12 English resources organised for Western Australian curriculum and senior secondary courses.',notice:'Choose a Year 7–10 tab or a separate senior ATAR/General course tab.',strands:['Language','Literature','Literacy']},HASS:{intro:'Years 7–12 Humanities and Social Sciences resources organised for Western Australian classrooms.',notice:'Choose a Year 7–10 tab or a separate senior ATAR/General course tab.',strands:['Civics and Citizenship','Economics and Business','Geography','History','HASS skills']},'Health and Physical Education':{intro:'Years 7–12 Health and Physical Education resources organised for Western Australian curriculum and senior courses.',notice:'Choose a Year 7–10 tab or a separate senior ATAR/General course tab.',strands:['Health Education — Personal identity and change','Health Education — Staying safe','Health Education — Healthy and active communities','Health Education — Interacting with others','Physical Education — Movement skills','Physical Education — Understanding movement','Physical Education — Interpersonal skills']}};const d=DATA[subject]||DATA.Mathematics,RES=window.SENIOR_RESOURCES||[],courses=(window.SENIOR_COURSES&&SENIOR_COURSES[subject])||[];document.title=subject+' | Learning Vault WA';subjectTitle.textContent=subject;subjectIntro.textContent=d.intro;eyebrow.textContent=subject.toUpperCase()+' • WESTERN AUSTRALIA';curriculumNotice.textContent=d.notice;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fileUrl(r){return new URL(r.file,location.href).href}function preview(r){const u=fileUrl(r);if(/\.pdf$/i.test(r.file))return u;const raw='https://raw.githubusercontent.com/science-vault/science-vault-wa/main/'+r.file.split('/').map(encodeURIComponent).join('/');return'https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(raw)}function card(r){return `<article class="syllabus-resource"><div><b>${esc(r.title)}</b><small>${esc(r.type)}${r.school?' • '+esc(r.school):''}</small><small><strong>Original file:</strong> ${esc(r.file.split('/').pop())}</small></div><div class="resource-actions"><a class="preview-btn" href="${preview(r)}" target="_blank" rel="noopener">Preview</a><a class="download-btn" href="${fileUrl(r)}" download>Download</a></div></article>`}function schoolGroups(rows){const g={};rows.forEach(r=>{const s=r.school||'Other / No school identified';(g[s]??=[]).push(r)});const entries=Object.entries(g);if(entries.length===1&&entries[0][0]==='Other / No school identified')return `<div class="compact-resource-list">${entries[0][1].map(card).join('')}</div>`;return entries.map(([s,a])=>`<details class="school-resource-group" open><summary><b>${esc(s)}</b><span>${a.length}</span></summary><div class="compact-resource-list">${a.map(card).join('')}</div></details>`).join('')}function grouped(rows){if(!rows.length)return'<p class="empty-dot">No uploaded resources matched yet.</p>';const g={};rows.forEach(r=>(g[r.type]??=[]).push(r));return Object.entries(g).map(([t,a])=>`<details class="resource-type-group"><summary><b>${esc(t)}</b><span>${a.length}</span></summary>${schoolGroups(a)}</details>`).join('')}function senior(course,pathway){const content=(SENIOR_CONTENT[course+'|'+pathway]||{});return `<div class="section-heading"><div><span class="eyebrow">SENIOR SECONDARY • ${pathway}</span><h2>${esc(course)}</h2></div><p>Year 11 Units 1–2 and Year 12 Units 3–4.</p></div><div class="syllabus-list">${[1,2,3,4].map(u=>{const yr=u<3?'Year 11':'Year 12',topics=content[u]||['Curriculum mapping for this unit is being verified against the applicable SCSA syllabus'],rows=RES.filter(r=>r.course===course&&r.pathway===pathway&&r.unit==='Unit '+u);return `<details class="dotpoint-card" open><summary><b>${yr} • Unit ${u}</b><span class="dot-count">${rows.length} resources</span></summary>${topics.map(t=>`<section class="syllabus-resource" style="display:block"><div><b>${esc(t)}</b><small>${esc(course)} • ${pathway} • ${yr} • Unit ${u}</small></div>${grouped(rows.filter(r=>r.topic===t))}</section>`).join('')}${grouped(rows.filter(r=>!r.topic))}</details>`}).join('')}</div>`}function tabs(){const base=['Year 7','Year 8','Year 9','Year 10'].map(y=>({kind:'year',value:y,label:y})),sen=courses.flatMap(c=>c.pathways.map(p=>({kind:'course',value:c.name+'|'+p,course:c.name,pathway:p,label:c.name+' '+p}))),all=base.concat(sen);courseTabs.innerHTML=all.map((x,i)=>`<button class="${selected.kind===x.kind&&selected.value===x.value?'active':''}" data-i="${i}">${esc(x.label)}</button>`).join('');courseTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=all[+b.dataset.i];selected=x;tabs();render()})}function render(){if(selected.kind==='course'){areaContent.innerHTML=senior(selected.course,selected.pathway);return}areaContent.innerHTML=`<div class="section-heading"><div><span class="eyebrow">${selected.value.toUpperCase()}</span><h2>${subject} resources</h2></div><p>Choose a curriculum area.</p></div><div class="card-grid">${d.strands.map(s=>`<article class="card"><h3>${s}</h3><p>PowerPoints, worksheets, activities, notes, revision and assessments will appear here as they are added.</p><b>Resources coming from your uploads →</b></article>`).join('')}</div>`}window.addEventListener('senior-resources-ready',render);tabs();render();
</script></body></html>
