<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Area | Learning Vault WA</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="syllabus.html">Science</a><a href="learning-area.html?subject=Mathematics">Mathematics</a><a href="learning-area.html?subject=English">English</a><a href="learning-area.html?subject=HASS">HASS</a><a href="learning-area.html?subject=Health%20and%20Physical%20Education">Health & PE</a><a href="library.html">Resources</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow" id="eyebrow">WESTERN AUSTRALIA</span><h1 id="subjectTitle">Learning Area</h1><p id="subjectIntro"></p></div></section><main class="section content"><div class="notice" id="curriculumNotice"></div><div class="year-tabs syllabus-tabs"><button class="active" data-year="Year 7">Year 7</button><button data-year="Year 8">Year 8</button><button data-year="Year 9">Year 9</button><button data-year="Year 10">Year 10</button><button data-year="Year 11">Year 11</button><button data-year="Year 12">Year 12</button></div><div id="areaContent"></div></main><footer><strong>Learning Vault WA © 2026</strong><span>Free learning resources for Western Australian students</span></footer><script src="senior-courses.js?v=20260927-2"></script><script src="senior-resources.js?v=20260927-1"></script><script>
const params=new URLSearchParams(location.search),subject=params.get('subject')||'Mathematics';let year='Year 7';
const DATA={Mathematics:{intro:'Years 7–12 Mathematics resources organised for Western Australian curriculum and senior secondary courses.',notice:'Choose Year 7–12 above. Years 11–12 show the appropriate ATAR and General courses, units and curriculum content.',strands:['Number and algebra','Measurement and geometry','Probability and statistics']},English:{intro:'Years 7–12 English resources organised for Western Australian curriculum and senior secondary courses.',notice:'Choose Year 7–12 above. Years 11–12 show the appropriate ATAR and General courses, units and curriculum content.',strands:['Language','Literature','Literacy']},HASS:{intro:'Years 7–12 Humanities and Social Sciences resources organised for Western Australian classrooms.',notice:'Choose Year 7–12 above. Years 11–12 show the appropriate HASS ATAR and General courses, units and curriculum content.',strands:['Civics and Citizenship','Economics and Business','Geography','History','HASS skills']},'Health and Physical Education':{intro:'Years 7–12 Health and Physical Education resources organised for Western Australian curriculum and senior courses.',notice:'Choose Year 7–12 above. Years 11–12 show Health & PE senior courses with the appropriate ATAR and General pathways.',strands:['Health Education — Personal identity and change','Health Education — Staying safe','Health Education — Healthy and active communities','Health Education — Interacting with others','Physical Education — Movement skills','Physical Education — Understanding movement','Physical Education — Interpersonal skills']}};
const d=DATA[subject]||DATA.Mathematics,RES=window.SENIOR_RESOURCES||[];document.title=subject+' | Learning Vault WA';document.getElementById('subjectTitle').textContent=subject;document.getElementById('subjectIntro').textContent=d.intro;document.getElementById('eyebrow').textContent=subject.toUpperCase()+' • WESTERN AUSTRALIA';document.getElementById('curriculumNotice').textContent=d.notice;
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fileUrl(r){return new URL(r.file,location.href).href}function preview(r){const u=fileUrl(r);if(/\.pdf$/i.test(r.file))return u;const raw='https://raw.githubusercontent.com/science-vault/science-vault-wa/main/'+r.file.split('/').map(encodeURIComponent).join('/');return'https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(raw)}function card(r){return `<article class="syllabus-resource"><div><b>${esc(r.title)}</b><small>${esc(r.type)}${r.school?' • '+esc(r.school):''}</small></div><div class="resource-actions"><a class="preview-btn" href="${preview(r)}" target="_blank">Preview</a><a class="download-btn" href="${fileUrl(r)}" download>Download</a></div></article>`}function grouped(rows){if(!rows.length)return'<p class="empty-dot">No uploaded resources matched yet.</p>';const g={};rows.forEach(r=>(g[r.type]??=[]).push(r));return Object.entries(g).map(([t,a])=>`<details class="resource-type-group"><summary><b>${esc(t)}</b><span>${a.length}</span></summary><div class="compact-resource-list">${a.map(card).join('')}</div></details>`).join('')}
function senior(){const courses=(SENIOR_COURSES[subject]||[]),units=year==='Year 11'?[1,2]:[3,4];return `<div class="section-heading"><div><span class="eyebrow">${year.toUpperCase()}</span><h2>${subject} senior courses</h2></div><p>Select an ATAR or General pathway and unit.</p></div><div class="syllabus-list">${courses.map(c=>`<section class="dotpoint-card"><div class="dotpoint-head"><div><h2>${esc(c.name)}</h2><p>${c.pathways.join(' • ')}</p></div></div>${c.pathways.map(p=>`<details class="resource-type-group"><summary><b>${p}</b><span>${year}</span></summary>${units.map(u=>{const topics=(SENIOR_CONTENT[c.name+'|'+p]||{})[u]||['Curriculum mapping for this unit is being verified against the applicable SCSA syllabus'],rows=RES.filter(r=>r.course===c.name&&r.pathway===p&&r.unit==='Unit '+u);return `<details class="dotpoint-card"><summary><b>Unit ${u}</b><span class="dot-count">${rows.length} resources</span></summary>${topics.map(t=>`<section class="syllabus-resource" style="display:block"><div><b>${esc(t)}</b><small>${esc(c.name)} • ${p} • Unit ${u}</small></div>${grouped(rows.filter(r=>r.topic===t))}</section>`).join('')}${grouped(rows.filter(r=>!r.topic))}</details>`}).join('')}</details>`).join('')}</section>`).join('')}</div>`}
function render(){const host=document.getElementById('areaContent');if(year==='Year 11'||year==='Year 12'){host.innerHTML=senior();return}host.innerHTML=`<div class="section-heading"><div><span class="eyebrow">${year.toUpperCase()}</span><h2>${subject} resources</h2></div><p>Choose a curriculum area.</p></div><div class="card-grid">${d.strands.map(s=>`<article class="card"><h3>${s}</h3><p>PowerPoints, worksheets, activities, notes, revision and assessments will appear here as they are added.</p><b>Resources coming from your uploads →</b></article>`).join('')}</div>`}document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=b.dataset.year;document.querySelectorAll('[data-year]').forEach(x=>x.classList.toggle('active',x===b));render()});window.addEventListener('senior-resources-ready',render);render();
</script></body></html>
