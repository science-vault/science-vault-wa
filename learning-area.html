<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Area | Learning Vault WA</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="syllabus.html">Science</a><a href="learning-area.html?subject=Mathematics">Mathematics</a><a href="learning-area.html?subject=English">English</a><a href="learning-area.html?subject=HASS">HASS</a><a href="library.html">Resources</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow" id="eyebrow">WESTERN AUSTRALIA</span><h1 id="subjectTitle">Learning Area</h1><p id="subjectIntro"></p></div></section><main class="section content"><div class="notice" id="curriculumNotice"></div><div class="year-tabs syllabus-tabs"><button class="active" data-year="Year 7">Year 7</button><button data-year="Year 8">Year 8</button><button data-year="Year 9">Year 9</button><button data-year="Year 10">Year 10</button></div><div id="areaContent"></div></main><footer><strong>Learning Vault WA © 2026</strong><span>Free learning resources for Western Australian students</span></footer><script>
const params=new URLSearchParams(location.search),subject=params.get('subject')||'Mathematics';let year='Year 7';
const DATA={Mathematics:{intro:'Years 7–10 Mathematics resources organised for the Western Australian Curriculum.',notice:'Mathematics uses the 2026 WA curriculum. Resources will be organised by Number and algebra, Measurement and geometry, and Probability and statistics.',strands:['Number and algebra','Measurement and geometry','Probability and statistics']},English:{intro:'Years 7–10 English resources organised by the Western Australian Curriculum.',notice:'English resources are organised around the interrelated strands of Language, Literature and Literacy.',strands:['Language','Literature','Literacy']},HASS:{intro:'Years 7–10 Humanities and Social Sciences resources organised for Western Australian classrooms.',notice:'HASS resources are organised across Civics and Citizenship, Economics and Business, Geography and History, with HASS skills integrated throughout.',strands:['Civics and Citizenship','Economics and Business','Geography','History','HASS skills']}};
const d=DATA[subject]||DATA.Mathematics;document.title=subject+' | Learning Vault WA';document.getElementById('subjectTitle').textContent=subject;document.getElementById('subjectIntro').textContent=d.intro;document.getElementById('eyebrow').textContent=subject.toUpperCase()+' • WESTERN AUSTRALIA';document.getElementById('curriculumNotice').textContent=d.notice;
function render(){document.getElementById('areaContent').innerHTML=`<div class="section-heading"><div><span class="eyebrow">${year.toUpperCase()}</span><h2>${subject} resources</h2></div><p>Choose a curriculum area. Resource folders are ready for future uploads.</p></div><div class="card-grid">${d.strands.map(s=>`<article class="card"><h3>${s}</h3><p>PowerPoints, worksheets, activities, notes, revision and assessments will appear here as they are added.</p><b>Resources coming from your uploads →</b></article>`).join('')}</div>`}document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=b.dataset.year;document.querySelectorAll('[data-year]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
