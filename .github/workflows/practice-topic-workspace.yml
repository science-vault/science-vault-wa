name: Practice topic test workspace
on:
  push:
    branches:
      - feature/practice-topic-test-workspace
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check practice-workspace.js
          node --check practice-topic-workspace-core.mjs
          node --check practice-reference-tools.mjs
      - name: Test practice navigation
        run: node --test tests/practice-topic-workspace.test.mjs tests/practice-reference-tools.test.mjs
