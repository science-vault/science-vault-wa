name: Batch 4 lesson analytics checks
on:
  push:
    branches:
      - feature/advanced-analytics-batch4
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check lesson-analytics-core.mjs
          node --check lesson-journey-store.mjs
          node --check lesson-journey.js
          node --check class-client.mjs
          node --check teacher-classes.mjs
      - name: Run unit tests
        run: node --test tests/lesson-analytics-core.test.mjs tests/teacher-reporting-core.test.mjs tests/lesson-practice-core.test.mjs tests/lesson-written-practice.test.mjs
