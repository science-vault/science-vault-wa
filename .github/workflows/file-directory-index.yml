name: Update File Directory Index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build directory index
        run: python3 scripts/build-file-directory-index.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- file-directory-index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add file-directory-index.json
          git commit -m "Update file directory index"
          git push
