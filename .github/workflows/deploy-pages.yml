name: Deploy Pages site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build Pages site artifact
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \
            ! -name '.gitignore' \
            -exec cp {} _site/ \;
          if [ -d resources ]; then cp -R resources _site/resources; fi
          if [ -d exams ]; then cp -R exams _site/exams; fi
          if [ -d textbooks ]; then cp -R textbooks _site/textbooks; fi
          echo 'Website artifact contents:'
          du -sh _site
          find _site -maxdepth 2 -type f | head -100
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
