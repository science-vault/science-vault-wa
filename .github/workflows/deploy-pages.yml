name: Deploy lightweight Pages site
on:
  push:
    branches: [main]
    paths-ignore:
      - 'resources/**'
      - 'exams/**'
      - 'textbooks/**'
  workflow_run:
    workflows: ['Build resource manifest']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # Cone mode includes root site files and these published asset trees.
          # Avoid downloading the archived exams/resources omitted by the artifact build.
          sparse-checkout: |
            assets/human-biology
            assets/physics
          sparse-checkout-cone-mode: true
      - name: Build lightweight site artifact
        run: |
          python page-catalog-builder.py
          mkdir -p _site
          find . -maxdepth 1 -type f \
            ! -name '.gitignore' \
            -exec cp {} _site/ \;

          # Publish lightweight teaching assets used directly by lesson pages.
          if [ -d assets ]; then
            mkdir -p _site/assets
            cp -R assets/human-biology _site/assets/
            cp -R assets/physics _site/assets/
          fi

          # Vault pages load these catalogues directly in the browser.
          # Validate every catalogue used by the public vaults before publishing.
          for f in resource-manifest.json powerpoint-manifest.json video-manifest.json exam-manifest.json textbook-manifest.json assessment-manifest.json assessment-year7.json assessment-year8.json assessment-year9.json assessment-year10.json assessment-year11.json assessment-year12.json; do
            test -s "_site/$f"
            python -m json.tool "_site/$f" >/dev/null
          done

          echo 'Vault catalogue sizes:'
          wc -c _site/*manifest.json _site/assessment-year*.json
          echo 'Website artifact contents:'
          du -sh _site
          find _site -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload lightweight Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

