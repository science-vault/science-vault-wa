name: Batch 1 lesson preview checks
on:
  push:
    branches:
      - feature/lesson-player-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lesson-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test lesson practice
        run: node --test tests/lesson-practice-core.test.mjs tests/lesson-written-practice.test.mjs
      - name: Assemble isolated preview
        run: |
          mkdir -p _lesson_preview
          cp topic-hub.html lesson-player-preview.html _lesson_preview/
          cp *.js *.mjs *.css *.json _lesson_preview/ 2>/dev/null || true
          cp -R assets _lesson_preview/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-player-batch1-preview
          path: _lesson_preview
          retention-days: 7
