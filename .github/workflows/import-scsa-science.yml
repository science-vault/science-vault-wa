name: Import SCSA Science curriculum
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import-scsa-science.py
      - name: Commit updated official curriculum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-curriculum-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official SCSA Science Years 7-10 curriculum"
            git push
          fi
