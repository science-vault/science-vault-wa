name: Rebuild Resource Catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-resource-manifest.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Rebuild resource catalogue
          file_pattern: resource-manifest.json
