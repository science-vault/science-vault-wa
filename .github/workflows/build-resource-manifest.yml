name: Build resource manifest
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'exams/**'
      - 'textbooks/**'
      - '.github/workflows/build-resource-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-manifest-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Update manifests incrementally
        run: |
          python - <<'PY'
          import os,json,re,subprocess,collections
          manifests={'resources':('resource-manifest.json',{'.ppt','.pptx','.doc','.docx','.pdf','.xls','.xlsx','.csv'}),'exams':('exam-manifest.json',{'.ppt','.pptx','.doc','.docx','.pdf','.xls','.xlsx','.csv'}),'textbooks':('textbook-manifest.json',{'.pdf','.jpg','.jpeg','.png','.webp'})}
          def load(name):
              try:
                  with open(name,encoding='utf-8') as f:return json.load(f)
              except (FileNotFoundError,json.JSONDecodeError):return []
          def full_scan(folder,exts):
              out=[]
              if not os.path.isdir(folder):return out
              for root,_,files in os.walk(folder):
                  for f in files:
                      p=os.path.join(root,f).replace('\\','/')
                      if os.path.splitext(f)[1].lower() in exts:out.append({'path':p,'size':os.path.getsize(p)})
              return out
          manual=os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch';changed=[]
          if not manual:
              try:changed=subprocess.check_output(['git','diff','--name-status','HEAD^','HEAD'],text=True).splitlines()
              except Exception:manual=True
          for folder,(manifest,exts) in manifests.items():
              if manual or not os.path.exists(manifest):rows=full_scan(folder,exts)
              else:
                  existing={x['path']:x for x in load(manifest)}
                  for line in changed:
                      parts=line.split('\t');status=parts[0];paths=parts[1:]
                      if status.startswith('R') and len(paths)>=2:
                          old,new=paths[0],paths[1]
                          if old.startswith(folder+'/'):existing.pop(old,None)
                          paths=[new]
                      for p in paths:
                          if not p.startswith(folder+'/'):continue
                          existing.pop(p,None)
                          if os.path.isfile(p) and os.path.splitext(p)[1].lower() in exts:existing[p]={'path':p,'size':os.path.getsize(p)}
                  rows=list(existing.values())
              rows.sort(key=lambda x:x['path'].lower())
              with open(manifest,'w',encoding='utf-8') as h:json.dump(rows,h,ensure_ascii=False,separators=(',',':'))
          resources=load('resource-manifest.json')
          strong_rx=re.compile(r'(^|[ _\-.])(assessment|test|quiz|task|investigation|assignment|validation|summative|portfolio)([ _\-.]|$)|marking[ _-]*(key|guide)|answer[ _-]*key',re.I)
          folder_rx=re.compile(r'(^|/)(assessment|assessments|assessment tasks|assessment resources|tests|testing)(/|$)',re.I)
          def strong(path):return bool(folder_rx.search(path) or strong_rx.search(path.rsplit('/',1)[-1]))
          buckets=collections.defaultdict(list)
          for r in resources:
              p=r.get('path','');parts=p.split('/');yi=next((i for i,x in enumerate(parts) if re.fullmatch(r'(?:year\s*)?(7|8|9|10|11|12)',x,re.I)),None)
              if yi is not None:buckets['/'.join(parts[:yi+2])].append(p)
          roots=set()
          for key,ps in buckets.items():
              hits=sum(strong(p) for p in ps)
              if hits>=3 and hits/max(1,len(ps))>=.35:roots.add(key)
          def assessment(p):return strong(p) or any(p.startswith(root+'/') for root in roots)
          aliases={'maths':'Mathematics','math':'Mathematics','mathematics':'Mathematics','science':'Science','hass':'HASS','humanities':'HASS','humanities and social sciences':'HASS','english':'English','digital technologies':'Digital Technologies','digital technology':'Digital Technologies','health and physical education':'Health and Physical Education','health & physical education':'Health and Physical Education','hpe':'Health and Physical Education'}
          strands={'biological sciences':'Science','chemical sciences':'Science','earth and space sciences':'Science','earth & space sciences':'Science','physical sciences':'Science','science inquiry':'Science','investigating science':'Science','geography':'HASS','history':'HASS','civics and citizenship':'HASS','economics and business':'HASS'}
          def lower_subject(parts,path):
              for p in parts[1:-1]:
                  k=p.strip().lower()
                  if k in aliases:return aliases[k]
              for p in parts[1:-1]:
                  k=p.strip().lower()
                  if k in strands:return strands[k]
              return 'Other / Unclassified'
          generic={'resources','atar','general','lowerschool','powerpoints','worksheets','notes','practicals','revision','tests','assessments','other resources','lesson resources','important documents','by syllabus point','science','maths','mathematics','english','hass','humanities','digital technologies','health and physical education'}
          def source(parts,yi):
              candidates=list(reversed(parts[1:yi]))+parts[yi+1:-1]
              for q in candidates:
                  q=q.strip();low=q.lower()
                  if low in generic or low in aliases or low in strands or re.fullmatch(r'year\s*\d+',q,re.I) or re.fullmatch(r'unit\s*[1-4]',q,re.I):continue
                  if re.search(r'school|college|academy|grammar|senior high|secondary|catholic|anglican|christian|community',q,re.I):return q
              return 'Unspecified source'
          out=[]
          for r in resources:
              path=r.get('path','')
              if not assessment(path):continue
              parts=path.split('/');yi=-1;yn=None
              for i,p in enumerate(parts):
                  m=re.fullmatch(r'(?:year\s*)?(7|8|9|10|11|12)',p,re.I)
                  if m:yn=int(m.group(1));yi=i;break
              if not yn:continue
              if yn<=10:subject=lower_subject(parts,path);pathway='Years 7–10';unit=''
              else:
                  pathway='ATAR' if any(p.upper()=='ATAR' for p in parts) else ('GENERAL' if any(p.lower()=='general' for p in parts) else 'Senior')
                  pi=next((i for i,p in enumerate(parts) if p.upper()=='ATAR' or p.lower()=='general'),-1)
                  if pi>=0 and pi+1<len(parts) and not re.fullmatch(r'(?:year\s*)?(11|12)',parts[pi+1],re.I):subject=parts[pi+1]
                  else:
                      # Prefer course folder immediately before the year for Subject/Year layouts.
                      subject=parts[yi-1] if yi>1 else 'Other / Unclassified'
                  unit=next((p for p in parts if re.fullmatch(r'unit\s*[1-4]',p,re.I)),'')
              out.append({'path':path,'size':r.get('size',0),'year':'Year '+str(yn),'pathway':pathway,'subject':subject,'topic':'All Assessments','unit':unit,'school':source(parts,yi)})
          out.sort(key=lambda x:(x['year'],x['subject'],x['school'],x['path'].lower()))
          with open('assessment-manifest.json','w',encoding='utf-8') as h:json.dump(out,h,ensure_ascii=False,separators=(',',':'))
          for y in range(7,13):
              yr=[x for x in out if x['year']=='Year '+str(y)]
              with open('assessment-year%d.json'%y,'w',encoding='utf-8') as h:json.dump(yr,h,ensure_ascii=False,separators=(',',':'))
              print('Year',y,len(yr),'files',collections.Counter(x['subject'] for x in yr))
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Commit manifests safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resource-manifest.json exam-manifest.json textbook-manifest.json assessment-manifest.json assessment-year7.json assessment-year8.json assessment-year9.json assessment-year10.json assessment-year11.json assessment-year12.json
          if git diff --cached --quiet; then echo 'Manifests already current';exit 0;fi
          git commit -m 'Update manifests incrementally'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0;fi
            git fetch origin main;git rebase origin/main
          done
          git push origin HEAD:main
