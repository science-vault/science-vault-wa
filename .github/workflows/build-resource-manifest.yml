name: Build resource manifest
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - '.github/workflows/build-resource-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-manifest-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build manifest
        run: |
          python - <<'PY'
          import os,json
          exts={'.ppt','.pptx','.doc','.docx','.pdf','.xls','.xlsx','.csv'}
          rows=[]
          for root,dirs,files in os.walk('resources'):
              for f in files:
                  p=os.path.join(root,f).replace('\\','/')
                  if os.path.splitext(f)[1].lower() in exts:
                      rows.append({'path':p,'size':os.path.getsize(p)})
          rows.sort(key=lambda x:x['path'].lower())
          with open('resource-manifest.json','w',encoding='utf-8') as h:
              json.dump(rows,h,ensure_ascii=False,separators=(',',':'))
          print('Indexed',len(rows),'resources')
          PY
      - name: Commit manifest safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resource-manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already current'
            exit 0
          fi
          git commit -m 'Update resource manifest'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retry $attempt"
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
