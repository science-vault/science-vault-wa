name: Build resource manifest
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'exams/**'
      - 'textbooks/**'
      - '.github/workflows/build-resource-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-manifest-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Rebuild indexes without downloading archived documents
        run: |
          python scripts/rebuild-resource-indexes.py
          python scripts/build-vault-catalog.py
      - name: Validate indexes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('vault-catalog.json').read_text())
          assert c['uniqueFiles'] > 0
          assert sum(p['count'] for p in c['parts']) == c['uniqueFiles']
          for p in c['parts']:
              rows=json.loads(Path(p['file']).read_text())
              assert len(rows) == p['count']
              assert all(r['sha'] != 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391' for r in rows)
          print('Validated',c['uniqueFiles'],'unique files')
          PY
      - name: Commit manifests safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*manifest.json' 'assessment-year*.json' 'vault-catalog.json' 'vault-index-*.json' 'RESOURCE-AUDIT.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild deduplicated resource catalogues'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
