name: Build resource manifest
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'exams/**'
      - 'textbooks/**'
      - '.github/workflows/build-resource-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-manifest-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build folder-driven manifests
        run: |
          python - <<'PY'
          import os,json,re,subprocess
          EXTS={'.ppt','.pptx','.doc','.docx','.pdf','.xls','.xlsx','.csv','.mp4','.mov','.m4v','.webm'}
          JUNK=re.compile(r'(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|~\$[^/]+|\.~lock\.[^/]+|__MACOSX)(/|$)',re.I)
          def modified(p):
              try:return subprocess.check_output(['git','log','-1','--format=%cI','--',p],text=True).strip()
              except Exception:return ''
          def scan(root,exts=EXTS):
              out=[]
              if not os.path.isdir(root):return out
              for d,dirs,files in os.walk(root):
                  dirs[:]=[x for x in dirs if x not in {'.git','__MACOSX'}]
                  for f in files:
                      p=os.path.join(d,f).replace('\\','/')
                      if JUNK.search(p):continue
                      if os.path.splitext(f)[1].lower() in exts:out.append({'path':p,'size':os.path.getsize(p),'modified':modified(p)})
              return sorted(out,key=lambda x:x['path'].lower())
          def save(name,data):
              with open(name,'w',encoding='utf-8') as h:json.dump(data,h,ensure_ascii=False,separators=(',',':'))
          resources=scan('resources');save('resource-manifest.json',resources)
          # Small dedicated catalogue used by the PowerPoint Vault. It avoids asking
          # each visitor's browser to download GitHub's enormous recursive tree.
          powerpoints=[r for r in resources if os.path.splitext(r['path'])[1].lower() in {'.ppt','.pptx'}]
          save('powerpoint-manifest.json',powerpoints)
          save('exam-manifest.json',scan('exams'))
          textbook_exts={'.pdf','.jpg','.jpeg','.png','.webp'}
          textbooks=scan('resources/Textbooks',textbook_exts)+scan('textbooks',textbook_exts)
          textbooks=sorted({x['path']:x for x in textbooks}.values(),key=lambda x:x['path'].lower());save('textbook-manifest.json',textbooks)
          base='resources/Assessments';all_assess=[r for r in resources if r['path'].startswith(base+'/')];out=[]
          lower_alias={'maths':'Mathematics','mathematics':'Mathematics','science':'Science','english':'English','hass':'HASS','digital technologies':'Digital Technologies','digital technology':'Digital Technologies','health and physical education':'Health and Physical Education','hpe':'Health and Physical Education'}
          school_rx=re.compile(r'school|college|academy|grammar|senior high|secondary|catholic|anglican|christian|community|southern river|kennedy|narrogin|rossmoyne|aranmore',re.I)
          for r in all_assess:
              p=r['path'];parts=p.split('/')
              if len(parts)<4:continue
              if len(parts)>=6 and parts[2].lower()=='lowerschool' and re.fullmatch(r'Year\s*(7|8|9|10)',parts[3],re.I):
                  y=int(re.search(r'(7|8|9|10)',parts[3]).group(1));raw=parts[4].strip();subject=lower_alias.get(raw.lower(),raw);school='Unspecified source'
                  if len(parts)>=7 and school_rx.search(parts[5]):school=parts[5]
                  out.append({**r,'year':f'Year {y}','pathway':'Years 7–10','subject':subject,'topic':'All Assessments','unit':'','school':school});continue
              if parts[2].lower()=='lowerschool':continue
              course=parts[2].strip();ym=None
              for part in parts[3:-1]:
                  if re.fullmatch(r'Year\s*(11|12)|(?:11|12)',part,re.I):ym=int(re.search(r'(11|12)',part).group(1));break
              if ym is None:continue
              pathway='GENERAL' if re.search(r'\bGeneral\b',course,re.I) else 'ATAR';subject=re.sub(r'\s+(ATAR|General)\s*$','',course,flags=re.I).strip();unit=next((x for x in parts[3:-1] if re.fullmatch(r'Unit\s*[1-4]',x,re.I)),'');school=next((x for x in parts[3:-1] if school_rx.search(x)),'Unspecified source')
              out.append({**r,'year':f'Year {ym}','pathway':pathway,'subject':subject,'topic':'All Assessments','unit':unit,'school':school})
          out.sort(key=lambda x:(int(x['year'].split()[-1]),x['subject'].lower(),x['path'].lower()));save('assessment-manifest.json',out)
          for y in range(7,13):save(f'assessment-year{y}.json',[x for x in out if x['year']==f'Year {y}'])
          print('Resources:',len(resources),'PowerPoints:',len(powerpoints),'Assessments:',len(out),'Textbooks:',len(textbooks))
          PY
      - name: Commit manifests safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resource-manifest.json powerpoint-manifest.json exam-manifest.json textbook-manifest.json assessment-manifest.json assessment-year7.json assessment-year8.json assessment-year9.json assessment-year10.json assessment-year11.json assessment-year12.json
          if git diff --cached --quiet; then echo 'Manifests already current'; exit 0; fi
          git commit -m 'Rebuild folder-driven manifests with metadata'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main;git rebase origin/main
          done
          git push origin HEAD:main
