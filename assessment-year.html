<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessment Vault | Learning Vault WA</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="vault-ui.css">
<style>
.toolbar{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:16px;margin:18px 0}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.controls input,.controls select{width:100%;padding:11px 12px;border:1px solid #d8e2ea;border-radius:10px;background:#fff;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.group{background:#fff;border:1px solid #dfe6ec;border-radius:15px}.card{padding:18px;text-align:left;cursor:pointer;box-shadow:0 2px 8px rgba(20,35,55,.04)}.card:hover{border-color:#b9d7d2;transform:translateY(-1px)}.card strong,.card small,.card b{display:block}.card strong{font-size:16px}.card small{color:#758397;margin:6px 0}.card b{color:#158b7b}.group{margin:14px 0;overflow:hidden;box-shadow:0 2px 9px rgba(20,35,55,.04)}.group summary{padding:12px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#f7f9fb;border-bottom:1px solid #edf0f3}.group summary strong{font-size:14px}.group summary span{font-size:12px;color:#758397}.task{padding:13px 15px;border-top:1px solid #edf0f3}.group summary+.task{border-top:0}.task h3{margin:0 0 3px;font-size:14px;line-height:1.35}.task small{color:#7b8797;font-size:11px}.task-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.task-file{border:1px solid #d8e2ea;border-radius:8px;background:#f8fafb;padding:6px 8px;font-size:11px;line-height:1.25}.task-file.key{background:#f1f8f6;border-color:#cce4df}.task-file.rubric{background:#f7f4ed;border-color:#e8dfc8}.task-file a,.task-file button{font-weight:800;text-decoration:none}.task-file button{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:800}.back{border:0;background:#eaf4f2;color:#126f63;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;margin-bottom:12px}.status{background:#eef5f4;border:1px solid #d2e5e1;border-radius:12px;padding:11px 14px;margin-bottom:15px;font-size:13px}.hidden{display:none}.yearnav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.yearnav a{padding:8px 12px;border:1px solid #d8e2ea;border-radius:9px;background:#fff;text-decoration:none}.yearnav a.active{background:#132238;color:#fff}.assessment-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}.assessment-controls p{margin:0;font-size:13px;color:#5f6f80}.assessment-controls label{font-size:13px;font-weight:700}.assessment-controls select{padding:6px 8px;border:1px solid #d8e2ea;border-radius:8px;background:#fff}.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin:18px 0}.pager button{padding:7px 11px;border:1px solid #d8e2ea;border-radius:8px;background:#fff;cursor:pointer}.pager button:disabled{opacity:.45}.empty{padding:26px;text-align:center;background:#fff;border:1px solid #dfe6ec;border-radius:14px}#results>h2{margin:4px 0 8px}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.controls,.grid{grid-template-columns:1fr}.task-files{display:grid}}
</style>
<link rel="stylesheet" href="site-refresh.css?v=2026.10.9"><script src="site-shell.js?v=2026.10.9.2" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="library.html">Resources</a><a href="assessments.html">Assessments</a><a href="exams.html">Exams</a><a href="textbooks.html">Textbooks</a></nav></header>
<section class="page-hero"><div class="inner"><span class="eyebrow">ASSESSMENT VAULT</span><h1 id="heading">Assessments</h1><p id="intro"></p></div></section>
<main class="section content">
<div class="yearnav" id="yearnav"></div>
<div id="status" class="status">Loading assessment index…</div>
<div class="toolbar"><div class="controls"><input id="search" type="search" placeholder="Search tasks, schools or courses..."><select id="typeFilter"><option value="">All file types</option></select><select id="sourceFilter"><option value="">All sources</option></select><select id="sort"><option value="name-asc">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="date-desc">Date modified — newest</option><option value="date-asc">Date modified — oldest</option></select></div></div>
<div id="summary"></div><div id="cards" class="grid"></div><div id="results" class="hidden"></div>
</main>
<script src="vault-ui.js?v=2026.10.9.2"></script>
<script>
(async function(){
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const n=Number(params.get('year'));
const year=[7,8,9,10,11,12].includes(n)?n:7;
const lower=year<=10;
let rows=[],selected='',page=1,pageSize=10;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filename=r=>String(r.path||'').split('/').pop()||'Resource';
const clean=r=>filename(r).replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
const extension=r=>(filename(r).split('.').pop()||'FILE').toUpperCase();
const raw=r=>'https://raw.githubusercontent.com/science-vault/science-vault-wa/main/'+String(r.path||'').split('/').map(encodeURIComponent).join('/');
const source=r=>r.school||'Unspecified source';
function fileKind(r){const s=(filename(r)+' '+r.path).toLowerCase();if(/rubric|criteria/.test(s))return'rubric';if(/answer|marking|solution|mark key|marking key|\bmk\b/.test(s))return'key';return'task'}
function baseName(r){return clean(r).replace(/\b(answer key|answer sheet|answers?|marking key|marking guide|mark scheme|mark key|worked solutions?|solutions?|suggested answers?|model answers?|teacher answers?|teacher copy|rubric|marking rubric|assessment rubric|criteria sheet|marking criteria)\b/ig,' ').replace(/\bmk\b/ig,' ').replace(/\s+/g,' ').trim()||clean(r)}
function folder(r){return String(r.path||'').split('/').slice(0,-1).join('/')}
function groupTasks(list){const map=new Map();for(const r of list){const key=folder(r).toLowerCase()+'||'+baseName(r).toLowerCase();if(!map.has(key))map.set(key,{name:baseName(r),files:[]});map.get(key).files.push(r)}return Array.from(map.values())}
function options(el,values,label){const unique=Array.from(new Set(values.filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));el.innerHTML='<option value="">'+label+'</option>'+unique.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
$('heading').textContent='Year '+year+' Assessments';
$('intro').textContent=lower?'Choose a subject and browse grouped assessment tasks with their marking materials.':'Choose a senior course and browse grouped assessment tasks with their marking materials.';
$('yearnav').innerHTML=[7,8,9,10,11,12].map(y=>'<a class="'+(y===year?'active':'')+'" href="assessment-year.html?year='+y+'">Year '+y+'</a>').join('');
function showCards(){selected='';$('results').classList.add('hidden');$('cards').classList.remove('hidden');const groups={};rows.forEach(r=>{const s=r.subject||'Other';(groups[s]||(groups[s]=[])).push(r)});$('summary').innerHTML='<h2>Choose a '+(lower?'subject':'course')+'</h2><p>'+rows.length+' files across '+Object.keys(groups).length+' '+(lower?'subjects':'courses')+'.</p>';$('cards').innerHTML=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,a])=>'<button class="card" data-subject="'+esc(s)+'"><strong>'+esc(s)+'</strong><small>'+groupTasks(a).length+' grouped tasks • '+a.length+' files</small><b>Browse →</b></button>').join('');document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>openSubject(b.dataset.subject)))}
function openSubject(subject){selected=subject;page=1;$('cards').classList.add('hidden');$('results').classList.remove('hidden');const list=rows.filter(r=>(r.subject||'Other')===subject);options($('typeFilter'),list.map(extension),'All file types');options($('sourceFilter'),list.map(source),'All sources');render()}
function chip(r){const k=fileKind(r),label=k==='key'?'Marking / Answers':k==='rubric'?'Rubric':'Task',u=raw(r);return '<div class="task-file '+k+'" data-resource-path="'+esc(r.path)+'"><strong>'+label+'</strong> · '+esc(extension(r))+' · <button type="button" class="preview-btn" data-preview="'+esc(u)+'" data-title="'+esc(clean(r))+'">Preview</button> · <a class="download-btn" href="'+esc(u)+'" target="_blank" rel="noopener">Download</a></div>'}
function render(){let list=rows.filter(r=>(r.subject||'Other')===selected);const q=$('search').value.trim().toLowerCase(),ft=$('typeFilter').value,sf=$('sourceFilter').value;if(q)list=list.filter(r=>(clean(r)+' '+r.path+' '+source(r)).toLowerCase().includes(q));if(ft)list=list.filter(r=>extension(r)===ft);if(sf)list=list.filter(r=>source(r)===sf);let tasks=groupTasks(list);const sort=$('sort').value;tasks.sort((a,b)=>{if(sort==='name-desc')return b.name.localeCompare(a.name,undefined,{numeric:true});if(sort==='date-desc')return Math.max(...b.files.map(x=>Date.parse(x.modified||0)||0))-Math.max(...a.files.map(x=>Date.parse(x.modified||0)||0));if(sort==='date-asc')return Math.max(...a.files.map(x=>Date.parse(x.modified||0)||0))-Math.max(...b.files.map(x=>Date.parse(x.modified||0)||0));return a.name.localeCompare(b.name,undefined,{numeric:true})});const pages=Math.max(1,Math.ceil(tasks.length/pageSize));if(page>pages)page=pages;const start=(page-1)*pageSize,shown=tasks.slice(start,start+pageSize);const grouped={};shown.forEach(t=>{const k=source(t.files[0]);(grouped[k]||(grouped[k]=[])).push(t)});$('results').innerHTML='<button class="back" id="back">← '+(lower?'Subjects':'Courses')+'</button><h2>'+esc(selected)+'</h2><div class="assessment-controls"><p>Showing '+(tasks.length?start+1:0)+'–'+Math.min(start+pageSize,tasks.length)+' of '+tasks.length+' grouped tasks ('+list.length+' files)</p><label>Show <select id="pageSize"><option>10</option><option>25</option><option>50</option><option>100</option></select></label></div>'+(shown.length?Object.entries(grouped).map(([school,items])=>'<details class="group" open><summary><strong>'+esc(school)+'</strong><span>'+items.length+' tasks</span></summary>'+items.map(t=>'<article class="task"><h3>'+esc(t.name)+'</h3><small>'+t.files.length+' file'+(t.files.length===1?'':'s')+'</small><div class="task-files">'+t.files.sort((a,b)=>({task:0,key:1,rubric:2}[fileKind(a)]-({task:0,key:1,rubric:2}[fileKind(b)]))).map(chip).join('')+'</div></article>').join('')+'</details>').join(''):'<div class="empty">No assessments match the selected filters.</div>')+'<div class="pager"><button id="prev" '+(page<=1?'disabled':'')+'>Previous</button><span>Page '+page+' of '+pages+'</span><button id="next" '+(page>=pages?'disabled':'')+'>Next</button></div>';$('back').onclick=showCards;$('pageSize').value=String(pageSize);$('pageSize').onchange=e=>{pageSize=Number(e.target.value);page=1;render()};$('prev').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(page<pages){page++;render()}};if(window.VaultUI&&VaultUI.decorate)VaultUI.decorate($('results'))}
['search','typeFilter','sourceFilter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(selected){page=1;render()}}));
try{const response=await fetch('assessment-year'+year+'.json?cb='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw new Error('Catalogue is not an array');rows=data;$('status').textContent='Loaded '+rows.length+' Year '+year+' assessment files.';showCards()}catch(err){console.error('Assessment Vault loading error:',err);$('status').textContent='Assessment index unavailable. Please refresh the page.';$('summary').innerHTML='<div class="empty">The Year '+year+' Assessment catalogue could not be loaded.</div>'}
})();
</script>
</body></html>
