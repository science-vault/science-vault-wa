<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Vault | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><style>.toolbar{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:18px;margin:20px 0}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.controls input,.controls select{width:100%;padding:12px;border:1px solid #d8e2ea;border-radius:10px;background:#fff;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.group{background:#fff;border:1px solid #dfe6ec;border-radius:15px}.card{padding:20px;text-align:left;cursor:pointer}.card strong,.card small,.card b{display:block}.card small{color:#758397;margin:7px 0}.card b{color:#158b7b}.group{margin:12px 0;overflow:hidden}.group summary{padding:15px 17px;cursor:pointer;display:flex;justify-content:space-between;background:#f7f9fb}.file{padding:14px 16px;border-top:1px solid #edf0f3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}.file small{display:block;color:#7b8797;margin-top:4px}.actions{display:flex;gap:8px}.actions a{padding:8px 11px;font-size:12px}.back{border:0;background:#eaf4f2;color:#126f63;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;margin-bottom:15px}.status{background:#eef5f4;border:1px solid #d2e5e1;border-radius:12px;padding:13px 15px;margin-bottom:18px}.hidden{display:none}.yearnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.yearnav a{padding:9px 13px;border:1px solid #d8e2ea;border-radius:9px;background:#fff}.yearnav a.active{background:#132238;color:#fff}.pager{display:flex;justify-content:center;gap:8px;align-items:center;margin:22px 0}.pager button{padding:9px 12px;border:1px solid #d8e2ea;background:#fff;border-radius:9px;cursor:pointer}.pager button:disabled{opacity:.4}.meta{font-size:12px;color:#8290a0}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.controls,.grid{grid-template-columns:1fr}.file{display:flex;flex-direction:column;align-items:flex-start}.actions{width:100%}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="powerpoints.html">PowerPoints</a><a href="worksheets.html">Worksheets</a><a href="assessments.html">Assessment Vault</a><a href="exams.html">Exam Vault</a><a href="textbooks.html">Textbooks</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow">ASSESSMENT VAULT</span><h1 id="heading">Assessments</h1><p id="intro"></p></div></section><main class="section content"><div class="yearnav" id="yearnav"></div><div id="status" class="status">Loading assessment index…</div><div class="toolbar"><div class="controls"><input id="search" type="search" placeholder="Search files, schools or courses..."><select id="typeFilter"><option value="">All file types</option></select><select id="sourceFilter"><option value="">All sources</option></select><select id="sort"><option value="name-asc">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="date-desc">Date modified — newest</option><option value="date-asc">Date modified — oldest</option><option value="size-desc">Size — largest</option><option value="size-asc">Size — smallest</option></select></div></div><div id="summary"></div><div id="cards" class="grid"></div><div id="results" class="hidden"></div></main><script>(async()=>{const qs=new URLSearchParams(location.search),Y=+[7,8,9,10,11,12].includes(+qs.get('year'))?+qs.get('year'):7,lower=Y<=10,$=id=>document.getElementById(id),repo='science-vault/science-vault-wa',branch='main',PER=10;let rows=[],selected='',page=1;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),title=r=>r.path.split('/').pop().replace(/\.[^.]+$/,'').replace(/_/g,' '),ext=r=>(r.path.split('.').pop()||'FILE').toUpperCase(),fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB',raw=r=>'https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+r.path.split('/').map(encodeURIComponent).join('/'),blob=r=>'https://github.com/'+repo+'/blob/'+branch+'/'+r.path.split('/').map(encodeURIComponent).join('/');function preview(r){const e=ext(r).toLowerCase(),u=raw(r);return e==='pdf'?u:['doc','docx','ppt','pptx','xls','xlsx'].includes(e)?'https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(u):blob(r)}$('heading').textContent='Year '+Y+' Assessments';$('intro').textContent=lower?'Choose a subject and browse its assessment files.':'Choose a senior course and browse its assessment files.';$('yearnav').innerHTML=[7,8,9,10,11,12].map(y=>'<a class="'+(y===Y?'active':'')+'" href="assessment-year.html?year='+y+'">Year '+y+'</a>').join('');function options(el,vals,label){el.innerHTML='<option value="">'+label+'</option>'+[...new Set(vals.filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')}function cards(){const g={};rows.forEach(r=>(g[r.subject]??=[]).push(r));$('summary').innerHTML='<h2>Choose a '+(lower?'subject':'course')+'</h2><p>'+rows.length+' files across '+Object.keys(g).length+' '+(lower?'subjects':'courses')+'.</p>';$('cards').innerHTML=Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,a])=>'<button class="card" data-s="'+esc(s)+'"><strong>'+esc(s)+'</strong><small>'+a.length+' files</small><b>Browse →</b></button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s))}function compare(a,b){const s=$('sort').value;if(s==='name-desc')return title(b).localeCompare(title(a),undefined,{numeric:true});if(s==='date-desc')return String(b.modified||'').localeCompare(String(a.modified||''));if(s==='date-asc')return String(a.modified||'').localeCompare(String(b.modified||''));if(s==='size-desc')return(b.size||0)-(a.size||0);if(s==='size-asc')return(a.size||0)-(b.size||0);return title(a).localeCompare(title(b),undefined,{numeric:true})}function render(){let a=rows.filter(r=>r.subject===selected),q=$('search').value.trim().toLowerCase(),ft=$('typeFilter').value,sf=$('sourceFilter').value;if(q)a=a.filter(r=>[title(r),r.school,r.path,r.unit].join(' ').toLowerCase().includes(q));if(ft)a=a.filter(r=>ext(r)===ft);if(sf)a=a.filter(r=>(r.school||'Unspecified source')===sf);a.sort(compare);const pages=Math.max(1,Math.ceil(a.length/PER));page=Math.min(page,pages);const start=(page-1)*PER,shown=a.slice(start,start+PER),g={};shown.forEach(r=>(g[lower?(r.school||'Unspecified source'):((r.unit?r.unit+' — ':'')+(r.school||'Unspecified source'))]??=[]).push(r));$('results').innerHTML='<button class="back" id="back">← '+(lower?'Subjects':'Courses')+'</button><h2>'+esc(selected)+'</h2><p>Showing '+(a.length?start+1:0)+'–'+Math.min(start+PER,a.length)+' of '+a.length+'</p>'+Object.entries(g).map(([k,v])=>'<details class="group" open><summary><strong>'+esc(k)+'</strong><span>'+v.length+' files</span></summary>'+v.map(r=>'<div class="file"><div><strong>'+esc(title(r))+'</strong><small>'+esc([r.pathway,r.unit].filter(Boolean).join(' • '))+'</small><span class="meta">'+esc(ext(r))+' • '+fmt(r.size||0)+(r.modified?' • '+new Date(r.modified).toLocaleDateString():'')+'</span></div><div class="actions"><a class="preview-btn" target="_blank" rel="noopener" href="'+esc(preview(r))+'">Preview</a><a class="download-btn" href="'+esc(raw(r))+'">Download</a></div></div>').join('')+'</details>').join('')+'<div class="pager"><button id="prev" '+(page<=1?'disabled':'')+'>← Previous</button><span>Page '+page+' of '+pages+'</span><button id="next" '+(page>=pages?'disabled':'')+'>Next →</button></div>';$('back').onclick=()=>{selected='';$('results').classList.add('hidden');$('cards').classList.remove('hidden');cards()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()}}function show(s){selected=s;page=1;$('cards').classList.add('hidden');$('results').classList.remove('hidden');const a=rows.filter(r=>r.subject===s);options($('typeFilter'),a.map(ext),'All file types');options($('sourceFilter'),a.map(r=>r.school||'Unspecified source'),'All sources');render()}['search','typeFilter','sourceFilter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(selected){page=1;render()}}));try{const res=await fetch('assessment-year'+Y+'.json?ts='+Date.now(),{cache:'no-store'});rows=await res.json();$('status').textContent='Loaded '+rows.length+' Year '+Y+' assessment files. Use the filters, sorting, Preview and Download controls below.';cards()}catch(e){$('status').textContent='Assessment index unavailable while deployment updates.'}})();</script></body></html>
