<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Vault | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><style>.toolbar{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:18px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.group{background:#fff;border:1px solid #dfe6ec;border-radius:15px}.card{padding:20px;text-align:left;cursor:pointer}.card strong,.card small,.card b{display:block}.card small{color:#758397;margin:7px 0}.card b{color:#158b7b}.group{margin:12px 0;overflow:hidden}.group summary{padding:15px 17px;cursor:pointer;display:flex;justify-content:space-between;background:#f7f9fb}.file{padding:13px 16px;border-top:1px solid #edf0f3;display:flex;justify-content:space-between;gap:15px;align-items:center}.file small{display:block;color:#7b8797;margin-top:3px}.actions{display:flex;gap:8px}.actions a{padding:8px 11px;font-size:12px}.back{border:0;background:#eaf4f2;color:#126f63;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;margin-bottom:15px}.status{background:#eef5f4;border:1px solid #d2e5e1;border-radius:12px;padding:13px 15px;margin-bottom:18px}.hidden{display:none}.yearnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.yearnav a{padding:9px 13px;border:1px solid #d8e2ea;border-radius:9px;background:#fff}.yearnav a.active{background:#132238;color:#fff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.file{align-items:flex-start;flex-direction:column}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="powerpoints.html">PowerPoints</a><a href="worksheets.html">Worksheets</a><a href="assessments.html">Assessment Vault</a><a href="exams.html">Exam Vault</a><a href="textbooks.html">Textbooks</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow">ASSESSMENT VAULT</span><h1 id="heading">Assessments</h1><p id="intro">Browse assessments by subject or senior course.</p></div></section><main class="section content"><div class="yearnav" id="yearnav"></div><div id="status" class="status">Loading this year's assessment index…</div><div class="toolbar"><div class="searchbox" style="max-width:none;margin:0;border:1px solid #dfe6ec;box-shadow:none"><span>⌕</span><input id="search" type="search" placeholder="Search this year..."></div></div><div id="summary"></div><div id="cards" class="grid"></div><div id="results" class="hidden"></div></main><script>(async()=>{const q=new URLSearchParams(location.search),year=+(q.get('year')||7),valid=[7,8,9,10,11,12],Y=valid.includes(year)?year:7,lower=Y<=10,$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),repo='science-vault/science-vault-wa',branch='main';$('heading').textContent='Year '+Y+' Assessments';$('intro').textContent=lower?'Choose a subject, then browse all Year '+Y+' assessments.':'Choose an ATAR or General course, then browse Year '+Y+' assessments.';$('yearnav').innerHTML=valid.map(y=>'<a class="'+(y===Y?'active':'')+'" href="assessment-year.html?year='+y+'">Year '+y+'</a>').join('');let rows=[],selected='';function title(r){return r.path.split('/').at(-1).replace(/\.[^.]+$/,'').replace(/_/g,' ')}function link(r,raw){const p=r.path.split('/').map(encodeURIComponent).join('/');return raw?'https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+p:'https://github.com/'+repo+'/blob/'+branch+'/'+p}function type(r){const s=r.path.toLowerCase();if(/marking|answer|solution|\bmk\b/.test(s))return'Marking / Answers';if(/quiz/.test(s))return'Quiz';if(/investigation|practical/.test(s))return'Investigation / Practical';if(/assignment/.test(s))return'Assignment';if(/test/.test(s))return'Test';return'Assessment'}function drawCards(){const g={};rows.forEach(r=>(g[r.subject]??=[]).push(r));$('summary').innerHTML='<h2>Choose a '+(lower?'subject':'course')+'</h2><p>'+rows.length+' indexed files across '+Object.keys(g).length+' '+(lower?'subjects':'courses')+'.</p>';$('cards').innerHTML=Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,a])=>'<button class="card" data-s="'+esc(s)+'"><strong>'+esc(s)+'</strong><small>'+a.length+' files</small><b>Browse assessments →</b></button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s))}function fileHtml(a){return a.sort((a,b)=>title(a).localeCompare(title(b),undefined,{numeric:true})).map(r=>'<div class="file"><div><strong>'+esc(title(r))+'</strong><small>'+esc([type(r),r.school,r.pathway,r.unit].filter(Boolean).join(' • '))+'</small></div><div class="actions"><a class="preview-btn" target="_blank" href="'+link(r,false)+'">Preview</a><a class="download-btn" href="'+link(r,true)+'">Download</a></div></div>').join('')}function render(){const s=$('search').value.toLowerCase(),a=rows.filter(r=>r.subject===selected&&(!s||[title(r),r.school,r.path,r.unit,r.topic].join(' ').toLowerCase().includes(s)));$('results').innerHTML='<button class="back" id="back">← '+(lower?'Subjects':'Courses')+'</button><h2>'+esc(selected)+'</h2>'+(()=>{const g={};a.forEach(r=>{const key=lower?(r.school||'Unspecified source'):((r.unit?r.unit+' — ':'')+(r.school||'Unspecified source'));(g[key]??=[]).push(r)});return Object.entries(g).sort((x,y)=>x[0].localeCompare(y[0],undefined,{numeric:true})).map(([k,v])=>'<details class="group" open><summary><strong>'+esc(k)+'</strong><span>'+v.length+' files</span></summary>'+fileHtml(v)+'</details>').join('')||'<p>No matching assessments.</p>'})() ;$('back').onclick=()=>{selected='';$('results').classList.add('hidden');$('cards').classList.remove('hidden');drawCards()}}function show(s){selected=s;$('cards').classList.add('hidden');$('results').classList.remove('hidden');$('search').value='';render()}$('search').addEventListener('input',()=>selected&&render());try{let res=await fetch('assessment-year'+Y+'.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok){res=await fetch('assessment-manifest.json?ts='+Date.now(),{cache:'no-store'});const all=await res.json();rows=all.filter(r=>r.year==='Year '+Y)}else rows=await res.json();$('status').textContent='Loaded '+rows.length+' Year '+Y+' assessment files.';drawCards()}catch(e){$('status').textContent='Assessment index unavailable. Please refresh after deployment.'}})();</script></body></html>
