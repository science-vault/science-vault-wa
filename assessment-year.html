<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Vault | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="vault-ui.css"><style>.toolbar{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:18px;margin:20px 0}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.controls input,.controls select{width:100%;padding:12px;border:1px solid #d8e2ea;border-radius:10px;background:#fff;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.group{background:#fff;border:1px solid #dfe6ec;border-radius:15px}.card{padding:20px;text-align:left;cursor:pointer}.card strong,.card small,.card b{display:block}.card small{color:#758397;margin:7px 0}.card b{color:#158b7b}.group{margin:12px 0;overflow:hidden}.group summary{padding:15px 17px;cursor:pointer;display:flex;justify-content:space-between;background:#f7f9fb}.task{padding:17px;border-top:1px solid #edf0f3}.task-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.task-head h3{margin:0;font-size:16px}.task-head small{display:block;color:#7b8797;margin-top:5px}.task-files{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.task-file{display:inline-flex;align-items:center;gap:7px;border:1px solid #d8e2ea;border-radius:9px;background:#fff;padding:8px 10px;font-size:12px}.task-file strong{font-size:11px}.task-file a,.task-file button{text-decoration:none;font-weight:800}.task-file button{border:0;background:none;padding:0;color:inherit;cursor:pointer;font:inherit;font-weight:800}.task-file.key{background:#f1f8f6;border-color:#cce4df}.task-file.rubric{background:#f7f4ed;border-color:#e8dfc8}.task-file.student{background:#f7f9fb}.back{border:0;background:#eaf4f2;color:#126f63;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;margin-bottom:15px}.status{background:#eef5f4;border:1px solid #d2e5e1;border-radius:12px;padding:13px 15px;margin-bottom:18px}.hidden{display:none}.yearnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.yearnav a{padding:9px 13px;border:1px solid #d8e2ea;border-radius:9px;background:#fff}.yearnav a.active{background:#132238;color:#fff}.assessment-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.meta{font-size:12px;color:#8290a0}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.controls,.grid{grid-template-columns:1fr}.task-head{display:block}.task-files{display:grid}.task-file{justify-content:space-between}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="library.html">Resources</a><a href="assessments.html">Assessments</a><a href="exams.html">Exams</a><a href="textbooks.html">Textbooks</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow">ASSESSMENT VAULT</span><h1 id="heading">Assessments</h1><p id="intro"></p></div></section><main class="section content"><div class="yearnav" id="yearnav"></div><div id="status" class="status">Loading assessment index…</div><div class="toolbar"><div class="controls"><input id="search" type="search" placeholder="Search tasks, schools or courses..."><select id="typeFilter"><option value="">All file types</option></select><select id="sourceFilter"><option value="">All sources</option></select><select id="sort"><option value="name-asc">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="date-desc">Date modified — newest</option><option value="date-asc">Date modified — oldest</option><option value="size-desc">Size — largest</option><option value="size-asc">Size — smallest</option></select></div></div><div id="summary"></div><div id="cards" class="grid"></div><div id="results" class="hidden"></div></main><script src="vault-ui.js"></script><script>(async()=>{const qs=new URLSearchParams(location.search),requested=Number(qs.get('year')),Y=[7,8,9,10,11,12].includes(requested)?requested:7,lower=Y<=10,$=id=>document.getElementById(id),repo='science-vault/science-vault-wa',branch='main';let rows=[],selected='',page=1;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),title=r=>VaultUI.cleanTitle(r.path.split('/').pop()),ext=r=>(r.path.split('.').pop()||'FILE').toUpperCase(),fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB',raw=r=>'https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+r.path.split('/').map(encodeURIComponent).join('/');function folder(r){return r.path.split('/').slice(0,-1).join('/')}function kind(r){const l=VaultUI.labels({path:r.path});return l.includes('Rubric')?'rubric':l.includes('Answer / Marking Key')?'key':'student'}function baseName(r){let n=title(r).replace(/\b(answer\s*key|answer\s*sheet|answers?|marking\s*key|marking\s*guide|mark\s*scheme|mark\s*key|worked\s*solutions?|solutions?|suggested\s*answers?|model\s*answers?|teacher\s*answers?|teacher\s*copy|rubric|marking\s*rubric|assessment\s*rubric|criteria\s*sheet|marking\s*criteria)\b/ig,' ').replace(/(^|[\s(])mk([\s)]|$)/ig,' ').replace(/\b(student|teacher)\s*(version|copy)?\b/ig,' ').replace(/[\s_\-–]+/g,' ').trim();return n||title(r)}function groupTasks(a){const m=new Map;for(const r of a){const key=folder(r).toLowerCase()+'||'+baseName(r).toLowerCase();if(!m.has(key))m.set(key,{name:baseName(r),folder:folder(r),files:[]});m.get(key).files.push(r)}return[...m.values()]}function groupLabel(t){return t.files.some(r=>kind(r)==='student')?t.name:t.name+' — Supporting material'}function newest(t){return Math.max(...t.files.map(r=>Date.parse(r.modified||0)||0))}function totalSize(t){return t.files.reduce((s,r)=>s+(r.size||0),0)}$('heading').textContent='Year '+Y+' Assessments';$('intro').textContent=lower?'Choose a subject and browse grouped assessment tasks with their marking materials.':'Choose a senior course and browse grouped assessment tasks with their marking materials.';$('yearnav').innerHTML=[7,8,9,10,11,12].map(y=>'<a class="'+(y===Y?'active':'')+'" href="assessment-year.html?year='+y+'">Year '+y+'</a>').join('');function options(el,vals,label){el.innerHTML='<option value="">'+label+'</option>'+[...new Set(vals.filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')}function cards(){const g={};rows.forEach(r=>(g[r.subject]??=[]).push(r));$('summary').innerHTML='<h2>Choose a '+(lower?'subject':'course')+'</h2><p>'+rows.length+' files across '+Object.keys(g).length+' '+(lower?'subjects':'courses')+'. Related task files are grouped together when you browse.</p>';$('cards').innerHTML=Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,a])=>'<button class="card" data-s="'+esc(s)+'"><strong>'+esc(s)+'</strong><small>'+groupTasks(a).length+' grouped tasks • '+a.length+' files</small><b>Browse →</b></button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s))}function compare(a,b){const s=$('sort').value;if(s==='name-desc')return groupLabel(b).localeCompare(groupLabel(a),undefined,{numeric:true});if(s==='date-desc')return newest(b)-newest(a);if(s==='date-asc')return newest(a)-newest(b);if(s==='size-desc')return totalSize(b)-totalSize(a);if(s==='size-asc')return totalSize(a)-totalSize(b);return groupLabel(a).localeCompare(groupLabel(b),undefined,{numeric:true})}function fileChip(r){const k=kind(r),lab=k==='key'?'Marking / Answers':k==='rubric'?'Rubric':'Task',labs=VaultUI.labelsHTML({path:r.path}),u=raw(r);return '<div class="task-file '+k+'" data-resource-path="'+esc(r.path)+'"><span><strong>'+lab+'</strong> · '+esc(ext(r))+'</span><span><button type="button" class="preview-btn" data-preview="'+esc(u)+'" data-title="'+esc(title(r))+'">Preview</button> · <a class="download-btn" target="_blank" rel="noopener" href="'+esc(u)+'">Download</a></span><div class="vault-labels" style="display:none">'+labs+'</div></div>'}function render(){let a=rows.filter(r=>r.subject===selected),q=$('search').value.trim().toLowerCase(),ft=$('typeFilter').value,sf=$('sourceFilter').value;if(q)a=a.filter(r=>[title(r),baseName(r),r.school,r.path,r.unit].join(' ').toLowerCase().includes(q));if(ft)a=a.filter(r=>ext(r)===ft);if(sf)a=a.filter(r=>(r.school||'Unspecified source')===sf);let tasks=groupTasks(a);tasks.sort(compare);const pages=VaultUI.pages(tasks);page=Math.min(page,pages);const shown=VaultUI.pageSlice(tasks,page),start=(page-1)*VaultUI.getPageSize(),g={};shown.forEach(t=>{const r=t.files[0],k=lower?(r.school||'Unspecified source'):((r.unit?r.unit+' — ':'')+(r.school||'Unspecified source'));(g[k]??=[]).push(t)});$('results').innerHTML='<button class="back" id="back">← '+(lower?'Subjects':'Courses')+'</button><h2>'+esc(selected)+'</h2><div class="assessment-controls"><p>Showing '+(tasks.length?start+1:0)+'–'+Math.min(start+VaultUI.getPageSize(),tasks.length)+' of '+tasks.length+' grouped tasks ('+a.length+' files)</p><div id="assessmentPageSize"></div></div>'+Object.entries(g).map(([k,v])=>'<details class="group" open><summary><strong>'+esc(k)+'</strong><span>'+v.length+' tasks</span></summary>'+v.map(t=>{const r=t.files[0],types=[...new Set(t.files.map(kind))];return '<article class="task"><div class="task-head"><div><h3>'+esc(groupLabel(t))+'</h3><small>'+esc([r.pathway,r.unit].filter(Boolean).join(' • '))+'</small></div><span class="meta">'+t.files.length+' file'+(t.files.length===1?'':'s')+' • '+fmt(totalSize(t))+'</span></div><div class="vault-labels">'+(types.includes('student')?'<span class="vault-label">Student Task</span>':'')+(types.includes('key')?'<span class="vault-label">Answer / Marking Key</span>':'')+(types.includes('rubric')?'<span class="vault-label">Rubric</span>':'')+'</div><div class="task-files">'+t.files.sort((x,y)=>({student:0,key:1,rubric:2}[kind(x)]-({student:0,key:1,rubric:2}[kind(y)])).map(fileChip).join('')+'</div></article>'}).join('')+'</details>').join('')+'<div id="assessmentPager"></div>';$('back').onclick=()=>{selected='';$('results').classList.add('hidden');$('cards').classList.remove('hidden');cards()};VaultUI.pageSize('assessmentPageSize',()=>{page=1;render()});VaultUI.pager('assessmentPager',page,pages,p=>{page=p;render()});VaultUI.decorate($('results'))}function show(s){selected=s;page=1;$('cards').classList.add('hidden');$('results').classList.remove('hidden');const a=rows.filter(r=>r.subject===s);options($('typeFilter'),a.map(ext),'All file types');options($('sourceFilter'),a.map(r=>r.school||'Unspecified source'),'All sources');render()}['search','typeFilter','sourceFilter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(selected){page=1;render()}}));try{const res=await fetch('assessment-year'+Y+'.json?v=4',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data))throw new Error('Invalid catalogue');rows=data;$('status').textContent='Loaded '+rows.length+' Year '+Y+' assessment files. Related tasks, marking keys, solutions and rubrics are automatically grouped into one tile when their folder and task name match.';cards()}catch(e){$('status').textContent='Assessment index unavailable. Please refresh the page.';$('summary').innerHTML='<div class="empty">The Year '+Y+' Assessment catalogue could not be loaded.</div>';console.error('Assessment Vault:',e)}})();</script></body></html>
