<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textbook Vault | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="vault-ui.css"><style>.tb-toolbar{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:20px;margin-bottom:28px}.tb-filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.tb-filters select{padding:12px;border:1px solid #d8e2ea;border-radius:10px;background:#fff}.tb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.tb-card{background:#fff;border:1px solid #dfe6ec;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.tb-cover-wrap{height:300px;background:#eef2f5;display:flex;align-items:center;justify-content:center;padding:18px}.tb-cover-placeholder{width:165px;height:235px;background:linear-gradient(145deg,#173149,#24665f);box-shadow:0 8px 18px #13223830;color:#fff;padding:22px 15px;display:flex;flex-direction:column;justify-content:space-between}.tb-cover-placeholder b{font-size:18px;line-height:1.15}.tb-cover-placeholder small{font-size:11px}.tb-body{padding:19px;display:flex;flex-direction:column;flex:1}.tb-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tb-meta span{font-size:10px;font-weight:800;background:#f0f3f6;border-radius:999px;padding:5px 8px}.tb-actions{display:flex;gap:8px;margin-top:auto}.tb-head{display:flex;justify-content:space-between;align-items:end;margin:20px 0}.tb-empty{padding:48px;text-align:center;background:#fff;border:1px solid #dfe6ec;border-radius:18px}@media(max-width:1050px){.tb-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.tb-grid{grid-template-columns:repeat(2,1fr)}.tb-filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.tb-grid,.tb-filters{grid-template-columns:1fr}.tb-head{display:block}.tb-head #count{margin-top:6px}}</style><link rel="stylesheet" href="site-refresh.css?v=2026.10.9"><script src="site-shell.js?v=2026.10.9.2" defer></script></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="library.html">Resources</a><a href="assessments.html">Assessments</a><a href="exams.html">Exams</a><a href="textbooks.html">Textbooks</a></nav></header><section class="page-hero"><div class="inner"><div class="crumbs"><a href="index.html">Learning Vault WA</a> / Textbook Vault</div><span class="eyebrow">TEXTBOOK VAULT</span><h1>Textbooks, organised.</h1><p>Browse textbooks by level, subject, publisher and series.</p></div></section><main class="section content"><div class="tb-toolbar"><div class="searchbox"><span>⌕</span><input id="q" type="search" placeholder="Search textbooks..."></div><div class="tb-filters"><select id="level"><option value="">All levels</option></select><select id="subject"><option value="">All subjects</option></select><select id="publisher"><option value="">All publishers</option></select><select id="series"><option value="">All series</option></select></div></div><div class="tb-head"><h2>Available textbooks</h2><div id="count">Loading…</div></div><div id="books"><div class="vault-loading">Loading textbooks…</div></div><div id="tbPager"></div></main><footer><div><strong>Learning Vault WA © 2026</strong></div></footer><script src="vault-ui.js"></script><script>(async()=>{const $=x=>document.getElementById(x),q=$('q'),level=$('level'),subject=$('subject'),publisher=$('publisher'),series=$('series'),books=$('books'),count=$('count');let rows=[],page=1;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function parse(x){let p=x.path.split('/'),name=p.pop(),i=p.findIndex(v=>v.toLowerCase()==='textbooks'),d=i>=0?p.slice(i+1):p,lev='',sub='',pub='',ser='';if((d[0]||'').toLowerCase()==='lowerschool'){lev='Lower School';sub=d[1]||'Other';pub=d[2]||'';ser=d[3]||''}else{sub=d[0]||'Other';lev=d[1]||'';pub=d[2]||'';ser=d[3]||''}return{path:x.path,name,title:name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').replace(/^\d{13}\s*/,'').replace(/\s+/g,' ').trim(),level:lev,subject:sub,publisher:pub,series:ser}}function opts(n,v,l){n.innerHTML='<option value="">'+l+'</option>'+[...new Set(v.filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('')}function raw(p){return'https://raw.githubusercontent.com/science-vault/science-vault-wa/main/'+p.split('/').map(encodeURIComponent).join('/')}function gh(p){return'https://github.com/science-vault/science-vault-wa/blob/main/'+p.split('/').map(encodeURIComponent).join('/')}function cover(r){return'<div class="tb-cover-placeholder"><small>LEARNING VAULT WA</small><b>'+esc(r.title)+'</b><small>'+esc([r.subject,r.level].filter(Boolean).join(' • '))+'</small></div>'}function render(){let s=q.value.toLowerCase(),f=rows.filter(r=>(!level.value||r.level===level.value)&&(!subject.value||r.subject===subject.value)&&(!publisher.value||r.publisher===publisher.value)&&(!series.value||r.series===series.value)&&(!s||Object.values(r).join(' ').toLowerCase().includes(s)));let pages=VaultUI.pages(f);page=Math.min(page,pages);count.textContent=f.length+' textbook'+(f.length===1?'':'s');let shown=VaultUI.pageSlice(f,page);books.innerHTML=shown.length?'<div class="tb-grid">'+shown.map(r=>'<article class="tb-card"><div class="tb-cover-wrap">'+cover(r)+'</div><div class="tb-body"><h3>'+esc(r.title)+'</h3><div class="tb-meta">'+[r.level,r.subject,r.publisher,r.series].filter(Boolean).map(v=>'<span>'+esc(v)+'</span>').join('')+'</div><div class="tb-actions"><a class="preview-btn" target="_blank" rel="noopener" href="'+gh(r.path)+'">Preview</a><a class="download-btn" href="'+raw(r.path)+'">Download</a></div></div></article>').join('')+'</div>':'<div class="tb-empty">No textbooks match the current filters.</div>';VaultUI.pager('tbPager',page,pages,p=>{page=p;render();scrollTo({top:document.querySelector('.tb-head').offsetTop-80,behavior:'smooth'})})}try{let r=await fetch('textbook-manifest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let m=await r.json();rows=m.filter(x=>/\.pdf$/i.test(x.path)).map(parse);opts(level,rows.map(x=>x.level),'All levels');opts(subject,rows.map(x=>x.subject),'All subjects');opts(publisher,rows.map(x=>x.publisher),'All publishers');opts(series,rows.map(x=>x.series),'All series');[q,level,subject,publisher,series].forEach(x=>x.addEventListener(x===q?'input':'change',()=>{page=1;render()}));render()}catch(e){count.textContent='Unavailable';books.innerHTML='<div class="tb-empty"><strong>Textbook index temporarily unavailable.</strong><br>Please refresh after the current deployment completes.</div>'}})();</script></body></html>
