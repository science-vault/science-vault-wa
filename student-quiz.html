<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Quiz | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><style>.quiz-shell{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field select,.field input,.answer{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd9e1;border-radius:9px}.primary{padding:12px 18px;border:0;border-radius:10px;background:#158b7b;color:#fff;font-weight:800}.secondary{padding:10px 14px;border:1px solid #ccd7df;background:#fff;border-radius:9px}.timer{font-size:24px;font-weight:900}.q{border-top:1px solid #e6ecef;padding:22px 0}.meta{font-size:12px;color:#687885;margin:5px 0 12px}.mark-row{padding:10px 0;border-bottom:1px solid #edf0f2}.got{color:#16745f}.miss{color:#b3261e}.diagram-wrap{max-width:760px;margin:14px auto}.physics-diagram{width:100%;height:auto}.review-answer{white-space:pre-wrap;background:#f7f9fa;border-radius:9px;padding:12px;margin:8px 0}.feedback{margin-top:5px;padding:7px 9px;background:#fff4f1;border-radius:7px;color:#7c241b}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="assessment-builders.html">Assessment Builder</a><a href="assessment-question-browser.html">Question Bank Database</a><a class="active" href="student-quiz.html">Student Quiz</a></nav></header><main class="quiz-shell"><section id="setup" class="card"><span class="eyebrow">STUDENT QUIZ</span><h1>Build a timed revision quiz</h1><p>Choose what you want to practise. The quiz targets approximately <b>one mark per minute</b>.</p><div class="grid"><div class="field"><label>Course / Subject</label><select id="course"></select></div><div class="field"><label>Year</label><select id="year"></select></div><div class="field"><label>Unit / Strand</label><select id="unit"></select></div><div class="field"><label>Topic</label><select id="topic"></select></div><div class="field"><label>Difficulty</label><select id="difficulty"><option value="all">Mixed difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="field"><label>Quiz time</label><select id="minutes"><option value="10">10 minutes (~10 marks)</option><option value="15">15 minutes (~15 marks)</option><option value="20" selected>20 minutes (~20 marks)</option><option value="30">30 minutes (~30 marks)</option><option value="45">45 minutes (~45 marks)</option><option value="60">60 minutes (~60 marks)</option><option value="0">Untimed practice</option></select></div></div><p id="availability"></p><button class="primary" id="start">Start Quiz</button></section><section id="quiz" class="card hidden"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><h2>Student Quiz</h2><div id="progress"></div></div><div class="timer" id="timer"></div></div><div id="questions"></div><button class="primary" id="submit">Submit Quiz</button></section><section id="results" class="hidden"><div class="card"><span class="eyebrow">RESULTS &amp; REVIEW</span><h1 id="score"></h1><p id="timeUsed"></p><div id="topicSummary"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="secondary" data-filter="all">All Questions</button><button class="secondary" data-filter="missed">Incorrect / Partial</button><button class="secondary" data-filter="correct">Correct</button><button class="primary" id="retry">Retry Incorrect Questions</button></div></div><div id="review"></div></section></main>
<script src="upper-school-assessment-bank-science.js"></script><script src="upper-school-assessment-question-bank-core2.js"></script><script src="upper-school-assessment-question-bank-core3.js"></script><script src="upper-school-assessment-bank-year12-science-2026.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-1.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-2.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-3.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-4.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-5.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-6.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-7.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-8.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-9.js"></script><script src="upper-school-human-biology-quiz-rules.js"></script><script src="upper-school-assessment-bank-physics-2026-expansion-1.js"></script><script src="upper-school-assessment-bank-physics-2026-expansion-2.js"></script><script src="upper-school-physics-detailed-keys.js"></script><script src="upper-school-physics-key-upgrade.js"></script><script>
const $=id=>document.getElementById(id);let selected=[],startedAt=0,timerId=null,duration=0,results=[];
const norm=s=>(s||'').toLowerCase().replace(/[–—]/g,'-').replace(/[^a-z0-9.%+\-]/g,' ').replace(/\s+/g,' ').trim();
function bank(){return window.UpperSchoolQuestionBank||[]}
function init(){let courses=[...new Set(bank().map(q=>q.course).filter(Boolean))].sort();$('course').innerHTML=courses.map(x=>`<option>${x}</option>`).join('');refreshYears()}
function refreshYears(){let ys=[...new Set(bank().filter(q=>q.course===$('course').value).map(q=>q.year))].sort();$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');refreshUnits()}
function refreshUnits(){let b=bank().filter(q=>q.course===$('course').value&&String(q.year)===$('year').value),u=[...new Set(b.map(q=>q.unit).filter(Boolean))].sort();$('unit').innerHTML='<option value="all">All units</option>'+u.map(x=>`<option>${x}</option>`).join('');refreshTopics()}
function refreshTopics(){let b=filtered(false),t=[...new Set(b.map(q=>q.topic).filter(Boolean))].sort();$('topic').innerHTML='<option value="all">All topics</option>'+t.map(x=>`<option>${x}</option>`).join('');showAvailability()}
function filtered(useTopic=true){return bank().filter(q=>q.course===$('course').value&&String(q.year)===$('year').value&&($('unit').value==='all'||q.unit===$('unit').value)&&(!useTopic||$('topic').value==='all'||q.topic===$('topic').value)&&($('difficulty').value==='all'||q.difficulty===$('difficulty').value))}
function showAvailability(){let b=filtered();$('availability').textContent=`${b.length} questions available • ${b.reduce((s,q)=>s+(+q.marks||0),0)} total marks.`}
function chooseToMarks(pool,target){let p=[...pool].sort(()=>Math.random()-.5),out=[],sum=0;for(let q of p){let m=+q.marks||0;if(!m||sum>=target)continue;if(sum+m<=target+1){out.push(q);sum+=m}}return out.length?out:p.slice(0,1)}
function answerBox(id){return `<textarea class="answer" id="${id}" rows="5" placeholder="Write your answer here"></textarea>`}
function renderQuestion(q,i){let body=`<div>${q.question}</div>${q.diagram||''}`;if(q.parts?.length)body+=q.parts.map((p,j)=>`<div style="margin:20px 0"><b>${p.label} ${p.text} [${p.marks} marks]</b>${answerBox(`a-${i}-${j}`)}</div>`).join('');else body+=answerBox(`a-${i}`);return `<article class="q"><h3>Question ${i+1}<span style="float:right">[${q.marks} marks]</span></h3><div class="meta">${q.unit||''} • ${q.topic||''} • ${q.type||''}</div>${body}</article>`}
function start(){let pool=filtered(),mins=+$('minutes').value;if(!pool.length)return;selected=chooseToMarks(pool,mins||20);duration=mins*60;startedAt=Date.now();$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');$('questions').innerHTML=selected.map(renderQuestion).join('');$('progress').textContent=`${selected.length} questions • ${selected.reduce((s,q)=>s+(+q.marks||0),0)} marks`;if(duration){tick();timerId=setInterval(tick,1000)}else $('timer').textContent='Untimed'}
function tick(){let left=Math.max(0,duration-Math.floor((Date.now()-startedAt)/1000));$('timer').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){clearInterval(timerId);submitQuiz()}}
function phrasePresent(a,p){p=norm(p);if(!p)return false;if(a.includes(p))return true;let stem=p.replace(/(ing|ed|es|s)$/,'');return stem.length>=5&&a.includes(stem)}
function groupPresent(a,group){return group.some(x=>phrasePresent(a,x))}
function ruleHit(answer,rule){let a=norm(answer);if(!a)return false;if(rule.value!==undefined){let nums=(a.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);return nums.some(n=>Math.abs(n-rule.value)<=Math.abs(rule.tolerance||0))}let required=rule.all||[];let main=required.every(g=>groupPresent(a,g));if(main)return true;return (rule.alternatives||[]).some(g=>groupPresent(a,g))}
function fallbackRules(row){if(row.accept)return [{all:row.accept.map(x=>[x]),feedback:row.feedback||row.work}];let txt=norm(row.work),tokens=txt.split(' ').filter(w=>w.length>=6&&!['correctly','identify','identifies','explain','explains','include','includes','recognition','appropriate','response'].includes(w));return tokens.length?[{all:[[tokens[0]]],feedback:'Review this marking point: '+row.work}]:[]}
function rulesFor(q,partIndex,rows){let qr=q.quizRules?.parts?.[partIndex===null?0:partIndex];if(qr?.length)return qr;return rows.flatMap(fallbackRules)}
function rowsFor(q,j=null){return j===null?(q.keyRows||[]):(q.partKeys?.[j]?.rows||[])}
function markPart(answer,q,j,max){let rows=rowsFor(q,j),rules=rulesFor(q,j,rows),earned=0,detail=[];rules.slice(0,max).forEach((r,idx)=>{let ok=ruleHit(answer,r),marks=r.marks||1;if(ok)earned+=marks;detail.push({ok,marks,work:rows[idx]?.work||r.model||'Required marking point',feedback:r.feedback||'Review this concept.'})});return {earned:Math.min(earned,max),detail}}
function markQuestion(q,i){if(q.parts?.length){let earned=0,details=q.parts.map((p,j)=>{let answer=$(`a-${i}-${j}`).value,res=markPart(answer,q,j,p.marks);earned+=res.earned;return {label:p.label,text:p.text,answer,max:p.marks,...res}});return {q,earned:Math.min(earned,q.marks),max:q.marks,details}}let answer=$(`a-${i}`).value,res=markPart(answer,q,null,q.marks);return {q,earned:res.earned,max:q.marks,details:[{label:'',text:q.question,answer,max:q.marks,...res}]}}
function submitQuiz(){if(timerId)clearInterval(timerId);results=selected.map(markQuestion);$('quiz').classList.add('hidden');$('results').classList.remove('hidden');let e=results.reduce((s,r)=>s+r.earned,0),m=results.reduce((s,r)=>s+r.max,0);$('score').textContent=`${e}/${m} — ${m?Math.round(e/m*100):0}%`;$('timeUsed').textContent=`Time used: ${formatTime(Math.floor((Date.now()-startedAt)/1000))}`;renderSummary();renderReview('all')}
function formatTime(s){return `${Math.floor(s/60)} min ${s%60} sec`}
function renderSummary(){let m={};results.forEach(r=>{let t=r.q.topic||'Other';m[t]??={e:0,x:0};m[t].e+=r.earned;m[t].x+=r.max});$('topicSummary').innerHTML='<h3>Topic breakdown</h3>'+Object.entries(m).map(([t,v])=>`<div>${t}: <b>${v.e}/${v.x}</b></div>`).join('')}
function reviewCard(r,i){let status=r.earned===r.max?'correct':'missed';let ds=r.details.map(d=>`<div class="card"><b>${d.label} ${d.text}</b><div class="review-answer"><b>Your answer:</b> ${d.answer||'<em>No answer</em>'}</div><p><b>${d.earned}/${d.max} marks</b></p>${d.detail.map(x=>`<div class="mark-row ${x.ok?'got':'miss'}">${x.ok?'✓ Achieved':'✗ Missed'} — ${x.work} <b>[${x.marks}]</b>${x.ok?'':`<div class="feedback"><b>Feedback:</b> ${x.feedback}</div>`}</div>`).join('')}</div>`).join('');return `<article class="card review-item" data-status="${status}"><h2>Question ${i+1}: ${r.earned}/${r.max}</h2><div>${r.q.question}</div>${r.q.keyDiagram||r.q.diagram||''}${ds}</article>`}
function renderReview(filter){$('review').innerHTML=results.map(reviewCard).join('');document.querySelectorAll('.review-item').forEach(x=>x.classList.toggle('hidden',filter!=='all'&&x.dataset.status!==filter))}
function retry(){let missed=results.filter(r=>r.earned<r.max).map(r=>r.q);if(!missed.length)return;selected=missed;results=[];startedAt=Date.now();duration=0;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('questions').innerHTML=selected.map(renderQuestion).join('');$('progress').textContent=`Retry • ${selected.length} questions • ${selected.reduce((s,q)=>s+(+q.marks||0),0)} marks`;$('timer').textContent='Untimed'}
$('course').onchange=refreshYears;$('year').onchange=refreshUnits;$('unit').onchange=refreshTopics;$('topic').onchange=showAvailability;$('difficulty').onchange=showAvailability;$('start').onclick=start;$('submit').onclick=submitQuiz;$('retry').onclick=retry;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>renderReview(b.dataset.filter));init();
</script></body></html>
