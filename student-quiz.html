<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Quiz | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><style>.quiz-shell{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field select,.field input,.answer{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd9e1;border-radius:9px}.primary{padding:12px 18px;border:0;border-radius:10px;background:#158b7b;color:#fff;font-weight:800}.secondary{padding:10px 14px;border:1px solid #ccd7df;background:#fff;border-radius:9px}.timer{font-size:24px;font-weight:900}.q{border-top:1px solid #e6ecef;padding:22px 0}.meta{font-size:12px;color:#687885;margin:5px 0 12px}.response-line{min-height:100px}.result-good{background:#edf9f4}.result-warn{background:#fff7e6}.mark-row{padding:8px 0;border-bottom:1px solid #edf0f2}.got{color:#16745f}.miss{color:#b3261e}.diagram-wrap{max-width:760px;margin:14px auto}.physics-diagram{width:100%;height:auto}.review-answer{white-space:pre-wrap;background:#f7f9fa;border-radius:9px;padding:12px;margin:8px 0}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}} </style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="assessment-builders.html">Assessment Builder</a><a href="assessment-question-browser.html">Question Bank Database</a><a class="active" href="student-quiz.html">Student Quiz</a></nav></header><main class="quiz-shell"><section id="setup" class="card"><span class="eyebrow">STUDENT QUIZ</span><h1>Build a timed revision quiz</h1><p>Choose what you want to practise. The quiz targets approximately <b>one mark per minute</b>.</p><div class="grid"><div class="field"><label>School level</label><select id="level"><option value="upper">Upper School (Years 11–12)</option><option value="lower">Lower School (Years 7–10)</option></select></div><div class="field"><label>Course / Subject</label><select id="course"></select></div><div class="field"><label>Year</label><select id="year"></select></div><div class="field"><label>Unit / Strand</label><select id="unit"><option value="all">All</option></select></div><div class="field"><label>Topic</label><select id="topic"><option value="all">All topics</option></select></div><div class="field"><label>Difficulty</label><select id="difficulty"><option value="all">Mixed difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="field"><label>Quiz time</label><select id="minutes"><option value="10">10 minutes (~10 marks)</option><option value="15">15 minutes (~15 marks)</option><option value="20" selected>20 minutes (~20 marks)</option><option value="30">30 minutes (~30 marks)</option><option value="45">45 minutes (~45 marks)</option><option value="60">60 minutes (~60 marks)</option><option value="0">Untimed practice</option></select></div></div><p id="availability"></p><button class="primary" id="start">Start Quiz</button></section><section id="quiz" class="card hidden"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><h2 id="quizTitle">Student Quiz</h2><div id="progress"></div></div><div class="timer" id="timer"></div></div><div id="questions"></div><button class="primary" id="submit">Submit Quiz</button></section><section id="results" class="hidden"><div class="card"><span class="eyebrow">RESULTS</span><h1 id="score"></h1><p id="timeUsed"></p><div id="topicSummary"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="secondary" data-filter="all">All Questions</button><button class="secondary" data-filter="missed">Incorrect / Partial</button><button class="secondary" data-filter="correct">Correct</button><button class="primary" id="retry">Retry Incorrect Questions</button></div></div><div id="review"></div></section></main>
<script src="upper-school-assessment-bank-science.js"></script><script src="upper-school-assessment-question-bank-core2.js"></script><script src="upper-school-assessment-question-bank-core3.js"></script><script src="upper-school-assessment-bank-year12-science-2026.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-1.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-2.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-3.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-4.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-5.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-6.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-7.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-8.js"></script><script src="upper-school-assessment-bank-human-biology-2026-expansion-9.js"></script><script src="upper-school-assessment-bank-physics-2026-expansion-1.js"></script><script src="upper-school-assessment-bank-physics-2026-expansion-2.js"></script><script src="upper-school-physics-detailed-keys.js"></script><script src="upper-school-physics-key-upgrade.js"></script><script>
const $=id=>document.getElementById(id);let selected=[],startedAt=0,timerId=null,duration=0,results=[];const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9.+-]/g,' ').replace(/\s+/g,' ').trim();
function bank(){return window.UpperSchoolQuestionBank||[]}
function init(){const courses=[...new Set(bank().map(q=>q.course).filter(Boolean))].sort();$('course').innerHTML=courses.map(x=>`<option>${x}</option>`).join('');refreshYears()}
function refreshYears(){let b=bank().filter(q=>q.course===$('course').value),ys=[...new Set(b.map(q=>q.year))].sort();$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');refreshUnits()}
function refreshUnits(){let b=bank().filter(q=>q.course===$('course').value&&String(q.year)===$('year').value),u=[...new Set(b.map(q=>q.unit).filter(Boolean))].sort();$('unit').innerHTML='<option value="all">All units</option>'+u.map(x=>`<option>${x}</option>`).join('');refreshTopics()}
function refreshTopics(){let b=filtered(false),t=[...new Set(b.map(q=>q.topic).filter(Boolean))].sort();$('topic').innerHTML='<option value="all">All topics</option>'+t.map(x=>`<option>${x}</option>`).join('');showAvailability()}
function filtered(includeTopic=true){return bank().filter(q=>q.course===$('course').value&&String(q.year)===$('year').value&&($('unit').value==='all'||q.unit===$('unit').value)&&(!includeTopic||$('topic').value==='all'||q.topic===$('topic').value)&&($('difficulty').value==='all'||q.difficulty===$('difficulty').value))}
function showAvailability(){const b=filtered();$('availability').textContent=`${b.length} questions available • ${b.reduce((s,q)=>s+(+q.marks||0),0)} total marks in this selection.`}
function chooseToMarks(pool,target){let p=[...pool].sort(()=>Math.random()-.5),out=[],sum=0;for(const q of p){if(!q.marks)continue;if(sum>=target)break;if(sum+(+q.marks)<=target+2){out.push(q);sum+=+q.marks}}if(!out.length&&p.length)out=[p[0]];return out}
function answerBox(id,label='Your answer'){return `<label><b>${label}</b><textarea class="answer" id="${id}" rows="5"></textarea></label>`}
function renderQuestion(q,i){let body=`<div>${q.question}</div>${q.diagram||''}`;if(q.parts?.length)body+=q.parts.map((p,j)=>`<div style="margin:18px 0"><b>${p.label} ${p.text} [${p.marks} marks]</b>${answerBox(`a-${i}-${j}`)}</div>`).join('');else body+=answerBox(`a-${i}`);return `<article class="q"><h3>Question ${i+1} <span style="float:right">[${q.marks} marks]</span></h3><div class="meta">${q.unit||''} • ${q.topic||''} • ${q.type||''}</div>${body}</article>`}
function start(){const pool=filtered(),mins=+$('minutes').value;if(!pool.length)return;selected=chooseToMarks(pool,mins||Math.min(20,pool.reduce((s,q)=>s+(+q.marks||0),0)));duration=mins*60;startedAt=Date.now();$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');$('questions').innerHTML=selected.map(renderQuestion).join('');$('progress').textContent=`${selected.length} questions • ${selected.reduce((s,q)=>s+(+q.marks||0),0)} marks`;if(duration){tick();timerId=setInterval(tick,1000)}else $('timer').textContent='Untimed'}
function tick(){let left=Math.max(0,duration-Math.floor((Date.now()-startedAt)/1000));$('timer').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(timerId);submitQuiz()}}
function rowsFor(q,partIndex=null){if(partIndex!==null)return q.partKeys?.[partIndex]?.rows||[];return q.keyRows||[]}
function concepts(row){if(row.accept)return row.accept.map(norm);let text=norm(row.work);let words=text.split(' ').filter(w=>w.length>4&&!['correctly','identifies','shows','valid','appropriate','response','answer','accept','including','through','between','toward'].includes(w));return [...new Set(words)].slice(0,4)}
function markText(answer,row){let a=norm(answer);if(!a)return false;let accepts=concepts(row);if(row.value!==undefined){let n=parseFloat(a);return Number.isFinite(n)&&Math.abs(n-row.value)<=Math.abs(row.tolerance||0)}if(!accepts.length)return false;if(row.requireAll)return accepts.every(x=>a.includes(x));return accepts.some(x=>a.includes(x))}
function markRows(answer,rows,maxMarks){let earned=0,detail=[];for(const r of rows){let m=parseInt(r.marks)||1,ok=markText(answer,r);if(ok)earned+=m;detail.push({ok,work:r.work,marks:m})}return {earned:Math.min(earned,maxMarks),detail}}
function markQuestion(q,i){if(q.parts?.length){let earned=0,details=[];q.parts.forEach((p,j)=>{let ans=$(`a-${i}-${j}`).value,res=markRows(ans,rowsFor(q,j),p.marks);earned+=res.earned;details.push({label:p.label,text:p.text,answer:ans,max:p.marks,...res})});return {q,earned:Math.min(earned,q.marks),max:q.marks,details}}let ans=$(`a-${i}`).value,res=markRows(ans,rowsFor(q),q.marks);return {q,earned:res.earned,max:q.marks,details:[{label:'',text:q.question,answer:ans,max:q.marks,...res}]}}
function submitQuiz(){if(timerId)clearInterval(timerId);results=selected.map(markQuestion);$('quiz').classList.add('hidden');$('results').classList.remove('hidden');let earned=results.reduce((s,r)=>s+r.earned,0),max=results.reduce((s,r)=>s+r.max,0),pct=max?Math.round(earned/max*100):0;$('score').textContent=`${earned}/${max} — ${pct}%`;$('timeUsed').textContent=`Time used: ${formatTime(Math.floor((Date.now()-startedAt)/1000))}`;renderSummary();renderReview('all')}
function formatTime(s){return `${Math.floor(s/60)} min ${s%60} sec`}
function renderSummary(){let m={};results.forEach(r=>{let t=r.q.topic||'Other';m[t]??={e:0,x:0};m[t].e+=r.earned;m[t].x+=r.max});$('topicSummary').innerHTML='<h3>Topic breakdown</h3>'+Object.entries(m).map(([t,v])=>`<div>${t}: <b>${v.e}/${v.x}</b></div>`).join('')}
function reviewCard(r,i){let cls=r.earned===r.max?'correct':r.earned===0?'missed':'missed';let detail=r.details.map(d=>`<div class="card"><b>${d.label} ${d.text}</b><div class="review-answer"><b>Your answer:</b> ${d.answer||'<em>No answer</em>'}</div><p><b>${d.earned}/${d.max} marks</b></p>${d.detail.map(x=>`<div class="mark-row ${x.ok?'got':'miss'}">${x.ok?'✓':'✗'} ${x.work} <b>[${x.marks}]</b>${x.ok?'':'<br><small>Review this marking point.</small>'}</div>`).join('')}</div>`).join('');return `<article class="card review-item" data-status="${cls}"><h2>Question ${i+1}: ${r.earned}/${r.max}</h2><div>${r.q.question}</div>${r.q.keyDiagram||r.q.diagram||''}${detail}</article>`}
function renderReview(filter){$('review').innerHTML=results.map(reviewCard).join('');document.querySelectorAll('.review-item').forEach(x=>x.classList.toggle('hidden',filter!=='all'&&x.dataset.status!==filter))}
function retry(){let missed=results.filter(r=>r.earned<r.max).map(r=>r.q);if(!missed.length)return;selected=missed;results=[];startedAt=Date.now();duration=0;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('questions').innerHTML=selected.map(renderQuestion).join('');$('progress').textContent=`Retry • ${selected.length} questions • ${selected.reduce((s,q)=>s+(+q.marks||0),0)} marks`;$('timer').textContent='Untimed'}
$('course').onchange=refreshYears;$('year').onchange=refreshUnits;$('unit').onchange=refreshTopics;$('topic').onchange=showAvailability;$('difficulty').onchange=showAvailability;$('start').onclick=start;$('submit').onclick=submitQuiz;$('retry').onclick=retry;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>renderReview(b.dataset.filter));init();
</script></body></html>
