<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Question Bank | Learning Vault WA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="home.css"><style>.controls{background:#fff;border:1px solid #dfe6ec;border-radius:18px;padding:16px;display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;position:sticky;top:8px;z-index:5}.controls select,.controls input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d6e0e7;border-radius:9px}.summary{margin:16px 0;padding:12px 15px;background:#f2f7f8;border-radius:10px;font-weight:700}.question-list{display:grid;gap:12px}.question{background:#fff;border:1px solid #dfe6ec;border-radius:14px;padding:16px}.qtop{display:flex;justify-content:space-between;gap:14px;margin-bottom:8px}.meta{font-size:12px;color:#70808c}.marks{font-weight:800;white-space:nowrap}.answer{display:none;margin-top:12px;padding:12px;background:#f8fafb;border-left:4px solid #158b7b}.question.open .answer{display:block}.toggle{margin-top:10px;border:1px solid #d6e0e7;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0}.pager button{padding:9px 13px;border:1px solid #d6e0e7;background:#fff;border-radius:8px}.diagram img,.diagram svg,.physics-diagram{max-width:100%;height:auto}.empty{text-align:center;padding:40px;color:#70808c}@media(max-width:900px){.controls{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.controls{grid-template-columns:1fr}.qtop{display:block}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">LV</span><span><strong>Learning Vault WA</strong><small>Free learning resources</small></span></a><nav><a href="index.html">Home</a><a href="assessment-builders.html">Assessment Builders</a><a class="active" href="assessment-question-browser.html">All Questions</a></nav></header><section class="page-hero"><div class="inner"><span class="eyebrow">ASSESSMENT QUESTION BANK</span><h1>Browse all builder questions.</h1><p>Search and filter the questions currently available in the Years 7–10 and Upper School assessment builders.</p></div></section><main class="section content"><div class="controls"><select id="level"><option value="all">All builders</option><option value="lower">Years 7–10</option><option value="upper">Years 11–12</option></select><select id="subject"><option value="all">All subjects</option></select><select id="year"><option value="all">All years</option></select><select id="type"><option value="all">All question types</option></select><input id="search" type="search" placeholder="Search questions or topics…"></div><div id="summary" class="summary">Loading question banks…</div><div id="list" class="question-list"></div><div id="pager" class="pager"></div></main><script src="assessment-question-bank.js?v=2026.15"></script><script src="upper-school-assessment-bank-science.js?v=2026.15"></script><script src="upper-school-assessment-question-bank-core2.js?v=2026.15"></script><script src="upper-school-assessment-question-bank-core3.js?v=2026.15"></script><script src="upper-school-assessment-bank-year12-science-2026.js?v=2026.15"></script><script src="upper-school-assessment-bank-physics-2026-expansion-1.js?v=2026.15"></script><script src="upper-school-assessment-bank-physics-2026-expansion-2.js?v=2026.15"></script><script src="upper-school-physics-detailed-keys.js?v=2026.15"></script><script src="upper-school-physics-key-upgrade.js?v=2026.15"></script><script>
const $=id=>document.getElementById(id),all=[],perPage=25;let page=1;
function addScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+'?v=2026.15';s.onload=resolve;s.onerror=reject;document.body.appendChild(s)})}
function normalise(){all.length=0;(window.AssessmentQuestionBank||[]).forEach(q=>all.push({...q,level:'lower',subject:q.subject||'Science',course:q.subject||'Science'}));const banks=window.AssessmentBuilderBanks||{};for(const y of [7,8,9,10]){const b=banks.mathematics?.[y]||banks[`mathematics-${y}`]||[];(b||[]).forEach(q=>all.push({...q,level:'lower',subject:'Mathematics',course:'Mathematics'}))}(window.UpperSchoolQuestionBank||[]).forEach(q=>all.push({...q,level:'upper',subject:q.course||q.subject||q.area||'Upper School',course:q.course||q.subject||q.area||'Upper School'}));}
function options(){const subjects=[...new Set(all.map(q=>q.course))].sort(),years=[...new Set(all.map(q=>String(q.year)))].sort(),types=[...new Set(all.map(q=>q.type).filter(Boolean))].sort();$('subject').innerHTML='<option value="all">All subjects / courses</option>'+subjects.map(x=>`<option>${x}</option>`).join('');$('year').innerHTML='<option value="all">All years</option>'+years.map(x=>`<option value="${x}">Year ${x}</option>`).join('');$('type').innerHTML='<option value="all">All question types</option>'+types.map(x=>`<option>${x}</option>`).join('')}
function filtered(){const l=$('level').value,s=$('subject').value,y=$('year').value,t=$('type').value,k=$('search').value.trim().toLowerCase();return all.filter(q=>(l==='all'||q.level===l)&&(s==='all'||q.course===s)&&(y==='all'||String(q.year)===y)&&(t==='all'||q.type===t)&&(!k||`${q.question||''} ${q.topic||''} ${q.unit||''} ${q.course||''}`.toLowerCase().includes(k)))}
function visual(q){return q.image?`<div class="diagram"><img src="${q.image}" alt="Question diagram"></div>`:q.diagram?`<div class="diagram">${q.diagram}</div>`:''}
function render(){const a=filtered(),pages=Math.max(1,Math.ceil(a.length/perPage));if(page>pages)page=pages;const slice=a.slice((page-1)*perPage,page*perPage);$('summary').textContent=`Showing ${slice.length?((page-1)*perPage+1):0}–${Math.min(page*perPage,a.length)} of ${a.length.toLocaleString()} matching questions • ${all.length.toLocaleString()} total questions loaded`;$('list').innerHTML=slice.length?slice.map((q,i)=>`<article class="question"><div class="qtop"><div><strong>${(page-1)*perPage+i+1}. ${q.course}${q.year?' — Year '+q.year:''}</strong><div class="meta">${q.level==='lower'?'Years 7–10':'Upper School'}${q.unit?' • '+q.unit:''}${q.topic?' • '+q.topic:''}${q.type?' • '+q.type:''}${q.difficulty?' • '+q.difficulty:''}</div></div><div class="marks">${q.marks||0} mark${q.marks==1?'':'s'}</div></div><div>${q.question||''}</div>${visual(q)}<button class="toggle" onclick="this.parentElement.classList.toggle('open');this.textContent=this.parentElement.classList.contains('open')?'Hide marking key':'Show marking key'">Show marking key</button><div class="answer"><b>Marking key:</b><br>${q.answer||'Detailed marking key available in builder.'}</div></article>`).join(''):'<div class="empty">No questions match these filters.</div>';$('pager').innerHTML=`<button ${page<=1?'disabled':''} onclick="page--;render()">← Previous</button><span>Page ${page} of ${pages}</span><button ${page>=pages?'disabled':''} onclick="page++;render()">Next →</button>`}
async function init(){for(const y of [7,8,9,10])try{await addScript(`assessment-builder/question-banks/mathematics/year${y}.js`)}catch(e){}normalise();options();render()}['level','subject','year','type'].forEach(id=>$(id).onchange=()=>{page=1;render()});$('search').oninput=()=>{page=1;render()};window.addEventListener('load',()=>setTimeout(init,100));
</script></body></html>
