<header class="p-top"><div class="p-brand">Learning Vault<span>.</span></div><div class="p-demo">Interactive lesson sample · no class results submitted</div></header>
<div class="p-layout"><aside class="p-side"><div class="p-eyebrow">Year 12 · Physics</div><h2>Horizontal<br>projectile motion</h2><p>One flight. Two directions.<br>About 12–15 minutes</p><div class="p-track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div style="width:0%"></div></div><span class="p-small" data-progress>Ready when you are</span><nav class="p-nav" aria-label="Lesson sections"></nav></aside>
<main class="p-main"><div class="p-context"><span>Unit 3 / Motion and forces</span><span data-step>Lesson preview</span></div><section class="p-card" aria-label="Current lesson activity"></section><div class="p-foot"><button class="p-btn" type="button" data-back>← Back</button><span class="p-small">Use g = 9.80 m/s² · Ignore air resistance</span><button class="p-btn p-primary" type="button" data-next>Start lesson →</button></div></main></div>
<script>
(function(){
 'use strict';const root=document.getElementById('lv-projectile-sample');if(!root)return;
 const $=s=>root.querySelector(s),card=$('.p-card'),labels=['Start here','Retrieve','Explore the model','Worked example','Find the time','Find the range','Try it yourself','Explain the physics','Exit: concept','Exit: calculation','Your progress'];
 let step=0,furthest=0,records={},worked=0,variant=0;const variants=[{h:44.1,u:8,t:3,x:24},{h:30.625,u:12,t:2.5,x:30},{h:78.4,u:6,t:4,x:24}];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const record=()=>records[step]||(records[step]={attempts:0,passed:false,hinted:false});
 const message=(html,tone='retry')=>{const el=$('[data-feedback]');el.hidden=false;el.dataset.tone=tone;el.innerHTML=html;};
 const feedback=()=>'<div class="p-feedback" data-feedback role="status" aria-live="polite" hidden></div>';
 const done=()=>{record().passed=true;$('[data-next]').disabled=false;};
 function diagram(t=0,interactive=false){return '<div class="p-diagram"><svg viewBox="0 0 640 270" role="img" aria-label="A ball launches horizontally from a platform. Its horizontal position increases uniformly while its downward displacement increases with time."><path d="M40 60H80V217H610" fill="none" stroke="#b5b2c5" stroke-width="2"/><path d="M80 60Q280 60 480 217" fill="none" stroke="#a58bdc" stroke-width="2" stroke-dasharray="5 6"/><path d="M88 42H192M184 36L192 42L184 48" fill="none" stroke="#7354dc" stroke-width="2"/><circle cx="80" cy="60" r="7" fill="#e6def6"/><circle data-ball cx="'+(80+200*t)+'" cy="'+(60+39.2*t*t)+'" r="9" fill="#7354dc"/><path d="M555 85V140M550 132L555 140L560 132" fill="none" stroke="#9d6a36" stroke-width="2"/></svg><div class="p-caption">Launch: 10.0 m/s horizontally · Height: 19.6 m · Gravity acts downward</div>'+(interactive?'<label class="p-small" for="p-time">Explore the flight · time <strong data-time>0.0 s</strong></label><input id="p-time" type="range" min="0" max="2" step="0.1" value="0"><div class="p-values"><span>Horizontal distance <strong data-x>0.0 m</strong></span><span>Downward distance <strong data-y>0.0 m</strong></span><span>Horizontal speed <strong>10.0 m/s</strong></span></div>':'')+'</div>';}
 function shell(chip,title,body){card.innerHTML='<span class="p-chip">'+chip+'</span><h1>'+title+'</h1>'+body;}
 function choices(prompt,options,answer,explanations){const r=record();card.insertAdjacentHTML('beforeend','<h3>'+prompt+'</h3><div class="p-choices">'+options.map((v,i)=>'<button class="p-choice" data-choice="'+i+'" aria-pressed="false" type="button"><span>'+String.fromCharCode(65+i)+'</span>'+v+'</button>').join('')+'</div><button class="p-btn p-primary" data-check type="button">Check answer</button>'+feedback());let chosen=r.choice??null;
  const buttons=[...root.querySelectorAll('[data-choice]')];function select(i){chosen=i;r.choice=i;buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));}
  buttons.forEach((b,i)=>b.onclick=()=>{if(!r.passed)select(i);});if(chosen!==null)select(chosen);
  function success(){buttons[answer].classList.add('p-right');message('<strong>That’s right.</strong> '+explanations[answer],'correct');done();$('[data-check]').disabled=true;buttons.forEach(b=>b.disabled=true);}
  $('[data-check]').onclick=()=>{if(chosen===null){message('Select an answer first.');return;}r.attempts++;if(chosen===answer)success();else message('<strong>Have another look.</strong> '+explanations[chosen]);};if(r.passed)success();
 }
 function numerical(prompt,fields,hint,explain){const r=record();card.insertAdjacentHTML('beforeend','<h3>'+prompt+'</h3><form data-form><div class="p-answer">'+fields.map((f,i)=>'<label class="p-field"><span>'+f.label+'</span><input id="p-n'+i+'" name="n'+i+'" inputmode="decimal" type="text" autocomplete="off" placeholder="Your answer" value="'+esc(r.values?.[i]||'')+'"></label><label class="p-field"><span>Unit</span><select name="u'+i+'" aria-label="Unit for '+f.label+'"><option value="">Choose unit</option>'+['s','m','m/s','m/s²'].map(u=>'<option'+(r.units?.[i]===u?' selected':'')+'>'+u+'</option>').join('')+'</select></label>').join('')+'</div><div class="p-actions"><button class="p-btn p-primary" type="submit">Check answer</button><button class="p-link" data-hint type="button">Give me a hint</button></div></form><div class="p-hint" data-hintbox hidden></div>'+feedback());
  const form=$('[data-form]');function success(){message('<strong>Correct.</strong> '+explain,'correct');done();form.querySelectorAll('input,select,button').forEach(e=>e.disabled=true);}
  $('[data-hint]').onclick=()=>{r.hinted=true;const b=$('[data-hintbox]');b.hidden=false;b.innerHTML=hint;};
  form.onsubmit=e=>{e.preventDefault();if(r.passed)return;r.values=fields.map((_,i)=>form.querySelector('[name=n'+i+']').value.trim());r.units=fields.map((_,i)=>form.querySelector('[name=u'+i+']').value);const vals=r.values.map(v=>v===''?NaN:Number(v));if(vals.some(v=>!Number.isFinite(v))){message('Enter a number in each answer field. Put the unit in the separate unit box.');return;}if(r.units.some(u=>!u)){message('Choose a unit for each answer.');return;}r.attempts++;const errors=fields.map((f,i)=>Math.abs(vals[i]-f.answer)<=f.tol?(r.units[i]===f.unit?'':f.label+': check the unit.'):f.error||f.label+': check your calculation.').filter(Boolean);if(!errors.length){success();return;}message('<strong>Not quite yet.</strong> '+errors.join(' ')+(r.attempts>=2&&step===6?' You can use the hint, or view a solution and try a fresh question.':''));if(r.attempts>=2&&step===6&&!$('[data-solution]')){const b=document.createElement('button');b.className='p-link';b.type='button';b.dataset.solution='';b.textContent='Show solution, then try a fresh question';form.append(b);b.onclick=()=>{r.hinted=true;message('<strong>Worked solution.</strong> '+explain+'<p>Now apply this method to a fresh question.</p>','neutral');b.disabled=true;const retry=document.createElement('button');retry.className='p-btn p-primary';retry.type='button';retry.textContent='Try a fresh question';retry.onclick=()=>{variant=(variant+1)%variants.length;records[step]={attempts:0,passed:false,hinted:true};render();};$('[data-feedback]').append(retry);};}}
  if(r.hinted){$('[data-hintbox]').hidden=false;$('[data-hintbox]').innerHTML=hint;}if(r.passed)success();
 }
 function render(){furthest=Math.max(furthest,step);const r=record();$('[data-back]').disabled=step===0;$('[data-next]').hidden=step===10;$('[data-next]').disabled=!r.passed&&![0,3].includes(step);$('[data-next]').textContent=step===0?'Start lesson →':step===9?'See my progress →':'Continue →';$('[data-step]').textContent=step===10?'Lesson complete':'Step '+(step+1)+' of 10';const percent=step===10?100:Math.round(step/10*100);$('.p-track').setAttribute('aria-valuenow',String(percent));$('.p-track>div').style.width=percent+'%';$('[data-progress]').textContent=percent+'% of lesson reached';$('.p-nav').innerHTML=labels.map((label,i)=>'<button type="button" data-go="'+i+'" '+(i>furthest?'disabled ':'')+(i===step?'aria-current="step"':'')+'><b>'+(records[i]?.passed?'✓':i+1)+'</b>'+label+'</button>').join('');root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.go);render();});
  if(step===0){shell('LET’S FIND OUT','One flight. Two directions.','<p class="p-lead">A ball rolls off a platform. How far from the edge will it land?</p>'+diagram()+'<p>You’ll separate horizontal and vertical motion, calculate flight time and range, then explain why the method works.</p><p class="p-small">You’ll enter answers, get feedback and retry. This sample keeps progress only while it is open.</p>');}
  if(step===1){shell('RETRIEVAL','Start with the forces.','<p>A ball has left a platform. Ignore air resistance. Gravity is the only force acting on it.</p>');choices('What is its horizontal acceleration?',['0 m/s²','9.80 m/s² forward','9.80 m/s² backward'],0,['No horizontal force means no horizontal acceleration. Its existing horizontal velocity continues.','Gravity acts vertically downward. It does not accelerate the ball forward.','A moving object does not need a backward force. Ignoring air resistance, there is no horizontal force.']);}
  if(step===2){shell('EXPLORE + PREDICT','Same clock. Different motion.','<p>Move through the flight. Horizontal distance grows evenly; downward distance grows faster as the ball accelerates.</p>'+diagram(0,true));choices('After 1.00 s, how far has the ball travelled horizontally?',['4.90 m','10.0 m','19.6 m'],1,['4.90 m is the downward distance after 1.00 s. For horizontal motion, use x = uₓt.','x = uₓt = 10.0 × 1.00 = 10.0 m. Both directions share this same elapsed time.','19.6 m is the platform height, not the horizontal distance after 1.00 s.']);const slider=$('#p-time');slider.oninput=()=>{const t=Number(slider.value),ball=$('[data-ball]');ball.setAttribute('cx',80+200*t);ball.setAttribute('cy',60+39.2*t*t);$('[data-time]').textContent=t.toFixed(1)+' s';$('[data-x]').textContent=(10*t).toFixed(1)+' m';$('[data-y]').textContent=(4.9*t*t).toFixed(1)+' m';};}
  if(step===3){shell('I DO · WORKED EXAMPLE','Find time before range.','<p>The ball launches horizontally at 10.0 m/s from a height of 19.6 m. Choose <strong>downward as positive</strong> for vertical motion.</p><div class="p-working" data-working></div><button class="p-btn p-primary" data-reveal type="button">Reveal the next step</button>'+feedback());const lines=[['1 · Identify','Vertical: uᵧ = 0, Δy = +19.6 m, aᵧ = +9.80 m/s². The horizontal launch speed is not uᵧ.'],['2 · Find time','Δy = uᵧt + ½aᵧt² → 19.6 = 0 + 4.90t² → t = √4.00 = 2.00 s. Use the positive time.'],['3 · Find range','Horizontal: aₓ = 0, so x = uₓt = 10.0 × 2.00 = 20.0 m.'],['4 · Check meaning','Time comes from the vertical drop. Use that same time for horizontal travel. The 20.0 m result is a horizontal distance, not the curved path length.']];function draw(){const container=$('[data-working]');container.innerHTML=lines.slice(0,worked).map(([label,text])=>'<div class="p-workstep"><b>'+label+'</b><p>'+text+'</p></div>').join('');$('[data-reveal]').hidden=worked===lines.length;$('[data-next]').disabled=worked<lines.length;if(worked===lines.length)done();} $('[data-reveal]').onclick=()=>{worked=Math.min(4,worked+1);draw();};draw();}
  if(step===4){shell('WE DO · TIME','Your turn: complete the method.','<p>A ball launches horizontally from a 19.6 m platform. Take downward as positive, so uᵧ = 0 and aᵧ = +9.80 m/s².</p><div class="p-equation">19.6 = ½ × 9.80 × t²</div>');numerical('How long is the ball in the air?',[{label:'Flight time',answer:2,tol:.02,unit:'s',error:'Divide 19.6 by 4.90, then take the square root. The result must be positive.'}],'First isolate t²: t² = 19.6 / 4.90. Then take the positive square root.','t² = 4.00, so t = 2.00 s.');}
  if(step===5){shell('WE DO · RANGE','Use the same time.','<p>The ball’s horizontal speed is 10.0 m/s. You found a flight time of 2.00 s.</p><div class="p-equation">x = uₓt = 10.0 × 2.00</div>');numerical('How far from the platform does it land?',[{label:'Horizontal range',answer:20,tol:.2,unit:'m',error:'Multiply the constant horizontal speed by the flight time. Do not add a gravity term to the horizontal equation.'}],'Distance = speed × time. Gravity affects the vertical component, not the horizontal component.','x = 20.0 m. The units are (m/s) × s = m.');}
  if(step===6){const v=variants[variant];shell('YOU DO · INDEPENDENT','A new platform. Your method.','<p>A ball launches <strong>horizontally at '+v.u.toFixed(2)+' m/s</strong> from a platform <strong>'+v.h+' m high</strong>. Find its flight time and horizontal range.</p><p class="p-small">Use downward as positive. Give answers to about 3 significant figures.</p>');numerical('Enter both answers.',[{label:'Flight time',answer:v.t,tol:.025,unit:'s',error:'For time, start with h = ½gt² and take the positive square root.'},{label:'Horizontal range',answer:v.x,tol:.25,unit:'m',error:'For range, use launch speed × your flight time. Keep the two directions separate.'}],'Solve the vertical drop first: t = √(2h/g). Then x = uₓt.','t = √(2 × '+v.h+' / 9.80) = '+v.t.toFixed(2)+' s; x = '+v.u.toFixed(2)+' × '+v.t.toFixed(2)+' = '+v.x.toFixed(1)+' m.');}
  if(step===7){shell('EXPLAIN · SELF-REVIEW','Put the physics into words.','<p>Why does the ball’s vertical velocity change while its horizontal velocity stays constant?</p><label for="p-explain" class="p-small">Write a short explanation using forces and acceleration.</label><textarea id="p-explain" placeholder="The forces acting on the ball are…">'+esc(r.text||'')+'</textarea><button class="p-btn p-primary" data-review type="button">Compare with a model answer</button><div data-model hidden></div>'+feedback());const input=$('#p-explain');input.oninput=()=>{r.text=input.value;};function model(){const target=$('[data-model]');target.hidden=false;target.innerHTML='<div class="p-feedback"><strong>Model answer</strong><p>Gravity provides a downward resultant force, so the ball accelerates downward and its vertical velocity changes. There is no horizontal resultant force, so horizontal acceleration is zero and horizontal velocity stays constant.</p></div><p class="p-small" style="margin-top:15px">This explanation is self-reviewed, not automatically marked. Check what your answer includes.</p><div class="p-rubric"><label><input type="checkbox" data-criterion="0">No horizontal resultant force → zero horizontal acceleration → constant horizontal velocity.</label><label><input type="checkbox" data-criterion="1">Downward gravity → downward acceleration → changing vertical velocity.</label></div><div class="p-actions"><button class="p-btn p-primary" data-selfyes type="button">My answer includes both</button><button class="p-btn" data-selfno type="button">I need more practice</button></div>';r.criteria=r.criteria||[false,false];target.querySelectorAll('[data-criterion]').forEach((c,i)=>{c.checked=r.criteria[i];c.onchange=()=>{r.criteria[i]=c.checked;};});$('[data-selfyes]').onclick=()=>{if(!r.criteria.every(Boolean)){message('Check both criteria only if they appear in your explanation, or choose “I need more practice”.');return;}r.selfReviewed=true;done();message('Self-review recorded. Your written explanation has not received an automatic score.','correct');};$('[data-selfno]').onclick=()=>{r.selfReviewed=false;done();message('Review recorded. Use the model to improve your explanation; this is not an automatic score.','neutral');};} $('[data-review]').onclick=()=>{r.text=input.value;if(r.text.trim().length<20){message('Write a short explanation before comparing it with the model.');return;}r.modelSeen=true;model();};if(r.modelSeen)model();}
  if(step===8){shell('EXIT CHECK · TRANSFER','Which reaches the ground first?','<p>Two identical balls start from the same height at the same instant. One is dropped from rest; the other is launched horizontally. Ignore air resistance.</p>');choices('Compare their landing times.',['The launched ball lands first.','They land at the same time.','The dropped ball lands first.'],1,['Horizontal speed does not add downward acceleration. Compare their initial vertical velocities and vertical accelerations.','Both start with uᵧ = 0, fall through the same height and have aᵧ = g. Their vertical motion—and landing time—is identical.','The launched ball’s longer curved path does not increase its vertical fall time. The vertical motions are identical.']);}
  if(step===9){shell('EXIT CHECK · CALCULATE','One final launch.','<p>A ball launches horizontally at <strong>6.00 m/s</strong> from a height of <strong>4.90 m</strong>. Calculate the flight time and horizontal range.</p>');numerical('Apply the method without the scaffold.',[{label:'Flight time',answer:1,tol:.01,unit:'s',error:'Use 4.90 = 4.90t², then take the positive square root.'},{label:'Horizontal range',answer:6,tol:.06,unit:'m',error:'Horizontal distance is 6.00 m/s multiplied by the flight time.'}],'The initial vertical velocity is zero. Time comes from the vertical equation; range comes from the horizontal equation.','t = √(2 × 4.90 / 9.80) = 1.00 s; x = 6.00 × 1.00 = 6.00 m.');}
  if(step===10){const tasks=[1,2,4,5,6,8,9],first=tasks.filter(i=>records[i]?.attempts===1&&!records[i]?.hinted).length,support=tasks.filter(i=>records[i]?.hinted).length; shell('LESSON COMPLETE','You connected the two directions.','<p class="p-lead">Find the time from the vertical motion. Use that same time for the horizontal motion.</p><table class="p-summary"><tbody><tr><td>Automatically checked activities completed</td><td>'+tasks.filter(i=>records[i]?.passed).length+' / 7</td></tr><tr><td>Correct first try, without a hint</td><td>'+first+' / 7</td></tr><tr><td>Activities where you used support</td><td>'+support+'</td></tr><tr><td>Written explanation</td><td>'+(records[7]?.selfReviewed?'Self-reviewed: both criteria':'Self-reviewed: needs practice')+'</td></tr></tbody></table><p class="p-small">This is feedback on one sample lesson, not a judgement of topic mastery. Results are not submitted or saved after you close this preview.</p><div class="p-actions"><button class="p-btn p-primary" data-worked type="button">Review the worked example</button><button class="p-btn" data-restart type="button">Restart sample</button></div>');$('[data-worked]').onclick=()=>{step=3;render();};$('[data-restart]').onclick=()=>{step=0;furthest=0;records={};worked=0;variant=0;render();};}
 }
 $('[data-next]').onclick=()=>{if($('[data-next]').disabled)return;record().passed=true;step=Math.min(10,step+1);render();};$('[data-back]').onclick=()=>{step=Math.max(0,step-1);render();};render();
})();
</script>
