<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Percent Change</title><desc id="d">Percent change equals new value minus old value divided by old value, multiplied by 100 percent.</desc><rect width="900" height="360" rx="18" fill="white" stroke="#355c7d" stroke-width="3"/><text x="450" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#b40000">Percent Change</text><text x="60" y="190" font-family="Arial,sans-serif" font-size="34">Percent Change =</text><text x="510" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="32">New Value − Old Value</text><line x1="350" y1="168" x2="670" y2="168" stroke="#111" stroke-width="3"/><text x="510" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="32">Old Value</text><text x="690" y="190" font-family="Arial,sans-serif" font-size="34">× 100%</text><text x="450" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="27">Positive = increase · Negative = decrease</text></svg>