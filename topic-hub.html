ld"><label>YEAR</label><select id="year"></select></div><div class="field"><label>UNIT / STRAND</label><select id="unit"></select></div></div><div class="path" id="path">Loading Question Bank…</div></section><section class="topics" id="topics"><div class="empty">Choose a course, year and strand to see available topics.</div></section><section class="lesson hidden" id="lesson"><button class="btn dark" id="backTopics" style="margin-bottom:18px">← Back to topics</button><div id="lessonContent"></div></section></main><script src="assessment-builder-subjects.js"></script><script src="student-quiz-bank-loader.js"></script><script src="topic-lessons.js"></script><script src="year7-topic-lessons-remaining.js"></script><script src="year7-biology-detailed.js"></script><script src="year7-biology-topics.js"></script><script src="topic-lms-player.js"></script><script src="topic-tiles.js"></script><script>const $=x=>document.getElementById(x),S={bank:[]};const uniq=(key,f)=>[...new Set(S.bank.filter(f||(()=>true)).map(q=>q[key]).filter(v=>v!==undefined&&v!==null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));function fill(el,a){el.innerHTML=a.length?a.map(v=>`<option value="${String(v).replace(/"/g,'&quot;')}">${v}</option>`).join(''):'<option value="">No options available</option>'}function biologyData(){const bank=window.TopicLessons||{};return Object.values(bank).filter(d=>String(d.year)==='7'&&d.course==='Science'&&d.unit==='Biological Sciences'&&d.html).sort((a,b)=>(b.lessons?.length||0)-(a.lessons?.length||0))[0]}function refreshCourse(){fill($('course'),uniq('course'));refreshYear()}function refreshYear(){fill($('year'),uniq('year',q=>q.course===$('course').value));refreshUnit()}function refreshUnit(){fill($('unit'),uniq('unit',q=>q.course===$('course').value&&String(q.year)===$('year').value));renderTopics()}function renderTopics(){const c=$('course').value,y=$('year').value,u=$('unit').value;$('path').textContent=[c,y,u].filter(Boolean).join(' → ');$('lesson').classList.add('hidden');$('topics').classList.remove('hidden');if(c==='Science'&&y==='7'&&u==='Biological Sciences'&&window.Year7BiologyTopics){ScienceVaultTopicTiles.render($('topics'),Year7BiologyTopics,openTopic)}else{$('topics').innerHTML='<div class="empty"><h3>Topic tiles are being built</h3><p>This strand will be converted to the same visual LMS format.</p></div>'}}function openTopic(t){const d=biologyData();if(!d)return;const selected={...d,topic:t.title,lessons:(d.lessons||[]).filter(l=>t.lessons.includes(Number(l.lesson)))};$('topics').classList.add('hidden');$('lesson').classList.remove('hidden');ScienceVaultLMS.build(selected,$('lessonContent'));$('lesson').scrollIntoView({behavior:'smooth'})}$('backTopics').onclick=()=>{renderTopics();$('topics').scrollIntoView({behavior:'smooth'})};$('course').onchange=refreshYear;$('year').onchange=refreshUnit;$('unit').onchange=renderTopics;(async()=>{try{S.bank=await StudentQuizBankLoader.load();refreshCourse()}catch(e){$('path').textContent='Question Bank could not be loaded.'}})();</script></body></html>
